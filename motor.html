/* ---------- Núcleo: ruteo de la frase ---------- */
const KWMOD = {
  accesos: /\b(ingres\w*|egres\w*|adentro|dentro|inside|check ?(in|out)|entr[oó]|salio|se fue|queda\w*)\b/,
  agenda: /\b(turnos?|trabajos?|reservas?|citas?|agenda\w*|entregas?|appointments?|jobs?|bookings?|schedule|libre|free|available)\b/,
  stock: /\b(stock|inventario|inventory|precio|price|faltantes?|reponer)\b/,
  reportes: /\b(resumen|reporte|informe|balance|summary|report|alertas?|alerts?|factur\w+|pdf)\b/,
  recordatorios: /\b(recordatorios?|recordame|avisame|reminders?|remind)\b/,
  plantillas: /\b(presupuesto|cotizacion|plantillas?|respuestas?|guarda\w*|budget|quote|template|templates|replies|reply|save)\b/,
  whatsapp: /\b(whatsapp|wsp|wasap)\b/,
  historial: /\b(reparacion\w*|servicio\w*|service|debe|deuda|pendientes? de pago|historial)\b/
};
function seguimiento(q) {
  const m = q.match(/^(?:y|and)\s+(.+?)\s*\??$/); if (!m || !ctx.last) return null;
  const rest = m[1]; const f = parseFecha(rest);
  if (f && ctx.last.kinds.includes('fecha')) return ctx.last.fn({ fecha: f });
  if (ctx.last.kinds.includes('persona')) { const c = personasEn(rest); if (c.length === 1) return ctx.last.fn({ persona: c[0].nombre }); }
  return null;
}

function interpretar(q, raw) {
  // 1) respuestas a algo pendiente
  // "no, el otro": cambia de opción en la última elección
  if (/^no[, ]+\s*(?:es\s+|era\s+)?(?:el|la|the)\s+(?:otro|otra|other)\b|^(?:el|la)\s+otr[oa]$|^the other one$/.test(q) && ctx.lastChoice) {
    ctx.pending = null;
    const c = ctx.lastChoice; const resto = c.lista.map((x, i) => i).filter(i => i !== c.i);
    if (resto.length === 1) { ctx.choice = c; return elegirIdx(resto[0]); }
    if (resto.length > 1) { const lst = resto.map(i => c.lista[i]); return elegir(lst, c.etiqueta, c.cont, c.termino); }
  }
  if (ctx.pending && /^(si|sii+|dale|ok|okey|oka|confirmo|confirma|confirmar|aceptar|yes|yep|yeah|sure|confirm|de una|va|listo)\b/.test(q)) return confirmar(true);
  if (ctx.pending && /^(no|nop|nope|cancela\w*|mejor no|cancel|dejalo|olvidalo)\b/.test(q)) return confirmar(false);
  if (ctx.choice) {
    const n = q.match(/^(?:el\s+|la\s+|n[°o]?\s*|opcion\s+)?(\d)\b/); if (n && +n[1] >= 1 && +n[1] <= ctx.choice.lista.length) return elegirIdx(+n[1] - 1);
    const ord = { primero: 0, primera: 0, first: 0, segundo: 1, segunda: 1, second: 1, tercero: 2, tercera: 2, third: 2 }; const mo = q.match(/\b(primero|primera|first|segundo|segunda|second|tercero|tercera|third)\b/); if (mo && ord[mo[1]] < ctx.choice.lista.length) return elegirIdx(ord[mo[1]]);
    const best = ctx.choice.lista.map((x, i) => ({ i, s: hitTokens(q, ctx.choice.etiqueta(x)).score })).sort((a, b) => b.s - a.s);
    if (best[0] && best[0].s >= 0.6 && (!best[1] || best[0].s > best[1].s)) return elegirIdx(best[0].i);
    if (/^(no|cancela\w*|ninguno|ninguna|none)\b/.test(q)) { ctx.choice = null; return R(L('Ok, lo dejo.', 'Ok, dropping it.')); }
  }
  if (/^(deshac\w*|undo|revert\w*|volve atras|anula lo ultimo|borra lo ultimo)\b|\b(deshace\w* lo ultimo|undo that|undo last)\b/.test(q)) return deshacer();
  if (/^(rehac\w*|redo)\b/.test(q)) return rehacer();
  const sg = seguimiento(q); if (sg) return sg;
  if (/^(hola|buenas|buen dia|buenos dias|buenas tardes|buenas noches|hey|hi|hello|good (morning|afternoon|evening))\b[\s!.]*$/.test(q) || (Cfg.voz.fraseActiva === false && q === norm(Cfg.asistente))) return R(Cfg.tono === 'amigable' ? L(`¡Hola! Soy ${Cfg.asistente} 😊 ¿En qué te ayudo?`, `Hi! I'm ${Cfg.asistente} 😊 How can I help?`) : L('Decime.', 'Tell me.'));
  if (/^(ayuda|help|que podes hacer|que sabes hacer|comandos|what can you do|\?)$/.test(q)) return ayuda();
  const mNom = q.match(/^(?:llamate|te llamas|tu nombre es|call yourself|your name is)\s+(.+)$/);
  if (mNom) { Cfg.asistente = cap(mNom[1]); guardarCfg(); return R(L(`Ok, ahora me llamo ${Cfg.asistente}.`, `Ok, I'm now called ${Cfg.asistente}.`), { refrescar: true }); }
  if (/^(resumen del dia|daily summary|resumen de hoy)$/.test(q) && moduloActivo('reportes') && Auth.puede('reportes')) { const r = hReportes(q, raw); if (r) return r; }
  // 2) módulos
  let apagado = null;
  const orden = [['plantillas', hPlantillas], ['whatsapp', hWhatsapp], ['recordatorios', hRecordatorios], ['accesos', hAccesos], ['historial', hHistorial], ['agenda', hAgenda], ['stock', hStock], ['chat', hPersonas], ['reportes', hReportes]];
  for (const [mod, fn] of orden) {
    const kw = KWMOD[mod];
    if (!moduloActivo(mod)) { if (kw && kw.test(q)) apagado = apagado || mod; continue; }
    if (!Auth.puede(mod)) { if (kw && kw.test(q)) apagado = apagado || ('perm:' + mod); continue; }
    const r = fn(q, raw); if (r) return r;
  }
  // Presupuesto/otros que no pasaron por KW
  if (apagado) return R(apagado.startsWith('perm:') ? L('Tu usuario no tiene permiso para eso.', "Your user doesn't have permission for that.") : L(`Esa función (${MODULOS[apagado].es}) no está activada en esta app.`, `That feature (${MODULOS[apagado].en}) isn't enabled in this app.`));
  return null;
}

function contextoDatos(raw) {
  const q = norm(raw); const out = [`Hoy es ${fmtFecha(todayIso(), 'es')}. Negocio: ${Cfg.negocio}.`];
  const ps = personasEn(q);
  const sel = new Set(ps.map(p => p.id));
  const linea = (col, d) => `${col}: ` + Object.entries(d).filter(([k, v]) => !['id', 'alias', 'por', 'avisado', 'hecho'].includes(k) && v !== '' && v != null && typeof v !== 'object').map(([k, v]) => `${k}=${v}`).join(', ');
  Store.all('personas').filter(p => sel.has(p.id)).forEach(p => out.push(linea('persona', p)));
  for (const col of ['servicios', 'agenda', 'accesos']) Store.all(col).filter(d => sel.has(d.personaId) || (!sel.size && col === 'agenda' && d.fecha >= todayIso()) ).slice(-25).forEach(d => out.push(linea(col, d)));
  productosEn(q).forEach(s => out.push(linea('stock', s)));
  if (!sel.size) Store.all('accesos').filter(a => a.fecha === todayIso()).forEach(d => out.push(linea('accesos', d)));
  return out.slice(0, 80).join('\n');
}

async function procesarTexto(raw) {
  raw = String(raw || '').trim(); if (!raw) return [];
  const q = norm(raw);
  let r = null;
  try { r = interpretar(q, raw); } catch (e) { console.error(e); r = R(L('Uy, algo falló al interpretar eso. Probá de otra forma.', 'Oops, something went wrong. Try rephrasing.')); }
  if (!r && IA.activa()) {
    try {
      const frase = await IA.reescribir(raw, ejemplosActivos());
      if (frase) { const rr = interpretar(norm(frase), frase); if (rr) { r = [].concat(rr); r[0] = { ...r[0], text: '🤖 “' + frase + '”\n' + r[0].text }; } }
      if (!r) { const datos = contextoDatos(raw); const txt = await IA.responderConDatos(raw, datos); r = R('🤖 ' + txt); }
    } catch (e) { r = R(L('No pude entender eso' + (IA.activa() ? ' (la IA falló: ' + (e.message || e) + ')' : '') + '. Escribí “ayuda” para ver ejemplos.', "I couldn't understand that. Type “help” for examples.")); }
  }
  if (!r) r = R(L('No entendí eso. 🤔 Escribí “ayuda” para ver qué puedo hacer, o activá la IA en Configuración para frases más libres.', "I didn't get that. 🤔 Type “help” to see what I can do, or turn on AI in Settings for freer phrasing."));
  const arr = [].concat(r);
  const main = arr[0]; if (main && main.text) ctx.lastBot = main.shareText || main.text;
  return arr;
}

/* ============ Facturas / fotos / importación de planillas ============ */
const esPrecio = t => /^\$?\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?$|^\$?\d+(?:[.,]\d{1,2})?$/.test(t) && (/[.,]\d{1,2}$/.test(t) || parseNum(t) >= 100);

function parseFacturaTexto(txt) {
  const lines = String(txt).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  let proveedor = '', fecha = '', total = 0; const items = [];
  for (const ln of lines) {
    const lo = norm(ln);
    const mf = ln.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})\b/);
    if (mf && !fecha) { const y = mf[3].length === 2 ? 2000 + +mf[3] : +mf[3]; fecha = `${y}-${pad2(+mf[2])}-${pad2(+mf[1])}`; }
    if (/\btotal\b/.test(lo) && !/subtotal/.test(lo)) { const n = ln.match(/(\d[\d.,]*)\s*$/); if (n) total = parseNum(n[1]); continue; }
    if (/\b(subtotal|iva|cuit|cuil|factura|remito|fecha|cliente|domicilio|direccion|tel|telefono|condicion|vendedor|cae|punto de venta|pto|descuento|neto|importe|cant|descripcion|concepto|codigo|precio|original|duplicado|gracias|ingresos brutos)\b/.test(lo)) continue;
    let rest = ln.replace(/\s{2,}/g, ' '); const parts = rest.split(' ');
    const precios = [];
    while (parts.length > 1 && precios.length < 2 && esPrecio(parts[parts.length - 1])) precios.unshift(parseNum(parts.pop()));
    let desc = parts.join(' ').trim(); let cant = 1;
    let m = desc.match(/^(\d{1,4}(?:[.,]\d+)?)\s*(?:x|u\.?|un\.?|unid\.?|uds?\.?)?\s+(?=[A-Za-zÁÉÍÓÚÑáéíóúñ])(.+)$/);
    if (m) { cant = parseNum(m[1]); desc = m[2]; }
    else { m = desc.match(/^(.+?)\s+x\s*(\d{1,4})$/i); if (m) { desc = m[1]; cant = +m[2]; } else { m = desc.match(/^(.+?)\s+(\d{1,3})\s*(?:u|un|unid|uds?)\.?$/i); if (m) { desc = m[1]; cant = +m[2]; } } }
    if (!/[A-Za-zÁÉÍÓÚÑáéíóúñ]{3}/.test(desc)) continue;
    if (!precios.length) { if (!proveedor && !/\d/.test(desc) && desc.length > 3) proveedor = cap(desc.toLowerCase()); continue; }
    let unit = precios[0];
    if (precios.length === 2) { const [a, b] = precios; unit = Math.abs(a * cant - b) <= Math.max(2, b * 0.02) ? a : (cant > 1 && Math.abs(b / cant - a) < 2 ? a : a); }
    items.push({ nombre: desc.replace(/\s+/g, ' ').trim(), cantidad: cant, precio: unit });
  }
  if (!total) total = items.reduce((t, i) => t + i.cantidad * i.precio, 0);
  return { proveedor, fecha: fecha || todayIso(), items, total };
}

function planFactura(fac) {
  return fac.items.map(it => {
    const m = productosEn(norm(it.nombre))[0];
    return { ...it, prod: m || null };
  });
}
function respuestaFactura(fac) {
  const plan = planFactura(fac);
  if (!plan.length) return R(L('No pude sacar productos de esa factura. Probá con una foto más clara, o pegá el texto con: “factura:” y una línea por producto (ej: 10 Cámara 26 2800).', "I couldn't read products from that invoice."));
  const txt = L(`Leí esto${fac.proveedor ? ' de ' + fac.proveedor : ''} (${fmtFechaCorta(fac.fecha)}):\n`, `I read this${fac.proveedor ? ' from ' + fac.proveedor : ''} (${fmtFechaCorta(fac.fecha)}):\n`) +
    plan.map(p => `• ${p.cantidad} × ${p.nombre} — ${money(p.precio)} c/u ${p.prod ? '→ ' + p.prod.nombre : L('→ (producto nuevo)', '→ (new product)')}`).join('\n') + `\nTotal: ${money(fac.total)}\n` +
    L('No toqué nada. ¿Qué querés hacer?', "I haven't changed anything. What would you like to do?");
  const mk = (tipo) => () => proponerFactura(fac, plan, tipo);
  return R(txt, {
    buttons: [
      { label: L('📦 Sumar al stock', '📦 Add to stock'), run: mk('stock') }, { label: L('💲 Actualizar precios', '💲 Update prices'), run: mk('precios') },
      { label: L('🧾 Solo guardar factura', '🧾 Just save invoice'), run: mk('guardar') }, { label: L('✅ Todo junto', '✅ Everything'), run: mk('todo') }, { label: L('🗑 Descartar', '🗑 Discard'), run: () => R(L('Descartada. No guardé nada.', 'Discarded. Nothing saved.')) }
    ]
  });
}
function proponerFactura(fac, plan, tipo) {
  const tx = []; const lin = []; const margen = +Cfg.margen || 0;
  const nuevos = {}; const acum = {};
  for (const p of plan) {
    if (tipo === 'stock' || tipo === 'todo') {
      if (p.prod) { const cur = Store.get('stock', p.prod.id); const ant = acum[p.prod.id] != null ? acum[p.prod.id] : (+cur.cantidad || 0); const nue = ant + p.cantidad; acum[p.prod.id] = nue; tx.push({ op: 'upd', col: 'stock', id: p.prod.id, patch: { cantidad: nue } }); lin.push(`${p.prod.nombre}: ${ant} → ${nue}`); }
      else { tx.push({ op: 'add', col: 'stock', doc: { nombre: cap(p.nombre), cantidad: p.cantidad, costo: p.precio, precio: Math.round(p.precio * (1 + margen / 100)), minimo: 0 } }); lin.push(L(`NUEVO ${cap(p.nombre)}: ${p.cantidad} u. (venta ${money(Math.round(p.precio * (1 + margen / 100)))})`, `NEW ${cap(p.nombre)}: ${p.cantidad} u.`)); nuevos[p.nombre] = 1; }
    }
    if ((tipo === 'precios' || tipo === 'todo') && p.prod && !nuevos[p.nombre]) {
      const venta = Math.round(p.precio * (1 + margen / 100));
      tx.push({ op: 'upd', col: 'stock', id: p.prod.id, patch: { costo: p.precio, precio: venta } });
      lin.push(L(`${p.prod.nombre}: costo ${money(p.precio)} · venta ${money(p.prod.precio || 0)} → ${money(venta)}`, `${p.prod.nombre}: cost ${money(p.precio)} · price ${money(p.prod.precio || 0)} → ${money(venta)}`));
    }
  }
  if (tipo === 'guardar' || tipo === 'todo') { tx.push({ op: 'add', col: 'facturas', doc: { fecha: fac.fecha, proveedor: fac.proveedor, items: fac.items, total: fac.total, estado: tipo === 'todo' ? 'aplicada' : 'guardada' } }); lin.push(L('Guardo la factura en el historial', 'Save the invoice in history')); }
  if (!tx.length) return R(L('No hay nada que cambiar con esa opción (los productos son nuevos o no coinciden).', 'Nothing to change with that option.'));
  const cab = { stock: L('Sumo al stock:', 'Add to stock:'), precios: L(`Actualizo precios (margen ${margen}%):`, `Update prices (margin ${margen}%):`), guardar: L('Guardo la factura:', 'Save invoice:'), todo: L('Aplico todo:', 'Apply all:') }[tipo];
  return proponer(cab + '\n' + lin.map(x => '• ' + x).join('\n'), tx, { desc: L('Factura de ', 'Invoice from ') + (fac.proveedor || '—') + ' (' + tipo + ')' });
}

/* ---- OCR y lectura de imagen ---- */
function cargarScript(src) { return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No pude cargar ' + src)); document.head.appendChild(s); }); }
async function ocrImagen(file) {
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');
  const r = await Tesseract.recognize(file, 'spa');
  return r.data.text;
}
async function archivoADataUrl(file, maxLado) {
  const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
  if (!/^data:image/.test(url)) return url;
  const img = new Image(); img.src = url; await img.decode();
  const k = Math.min(1, (maxLado || 1600) / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}

      case 'agenda': return `${fmtFechaCorta(d.fecha)} ${d.hora || ''} · ${d.titulo || ''} · ${d.estado || ''}`;
      case 'servicios': return `${fmtFechaCorta(d.fecha)} · ${d.detalle} · ${d.importe ? money(d.importe) : ''}${d.pagado === false ? ' · ' + L('PENDIENTE', 'UNPAID') : ''}`;
      case 'accesos': return `${fmtFechaCorta(d.fecha)} ${d.hora} · ${d.tipo}${d.conQuien ? ' · ' + L('con ', 'with ') + d.conQuien : ''}`;
      case 'recordatorios': return `${fmtFechaCorta(d.cuando.slice(0, 10))} ${d.cuando.slice(11)}${d.hecho ? ' ✔' : ''}`;
      case 'facturas': return `${fmtFechaCorta(d.fecha)} · ${(d.items || []).length} ${L('ítems', 'items')} · ${money(d.total || 0)} · ${d.estado}`;
      default: return d.texto || ''; } };
    const f = items.filter(d => !q || norm(titulo(d) + ' ' + detalle(d)).includes(q));
    if (!f.length) box.innerHTML = `<div class="note" style="padding:14px">${L('Sin registros.', 'No records.')}</div>`;
    f.slice(0, 200).forEach(d => {
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = `${Auth.esDueno() ? '<button class="acc" title="borrar">🗑</button>' : ''}<b>${esc(titulo(d))}</b><small>${esc(detalle(d))}</small>`;
      const x = r.querySelector('.acc'); if (x) x.onclick = () => { if (confirm(L('¿Borrar este registro?', 'Delete this record?'))) { const inv = aplicarTx([{ op: 'del', col: this.datosCol, id: d.id }]); ctx.undo.push({ desc: L('Borrado: ', 'Deleted: ') + titulo(d), inv }); Store.add('log', { ts: new Date().toISOString(), user: nombreUsuario(), texto: L('Borrado manual: ', 'Manual delete: ') + titulo(d) }); this.toast(L('Borrado. Podés decir “deshacer”.', 'Deleted. You can say “undo”.')); this.refrescarDatos(); } };
      box.appendChild(r);
    });
  },
  renderLog() {
    const box = $('#logList'); box.innerHTML = '';
    const l = Store.all('log').slice().sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 150);
    if (!l.length) box.innerHTML = `<div class="note" style="padding:14px">${L('Todavía no hay acciones registradas.', 'No actions recorded yet.')}</div>`;
    l.forEach(x => { const r = document.createElement('div'); r.className = 'row'; const dt = new Date(x.ts); r.innerHTML = `<b>${esc(x.texto)}</b><small>${fmtFechaCorta(iso(dt))} ${pad2(dt.getHours())}:${pad2(dt.getMinutes())} · ${esc(x.user)}</small>`; box.appendChild(r); });
  },

  /* ---- voz ---- */
  estadoVoz(e, txt) {
    const mic = $('#mic'), live = $('#live');
    if (e === 'escuchando') { mic.classList.add('on'); live.textContent = L('Escuchando…', 'Listening…'); }
    else if (e === 'parcial') live.textContent = '🎤 ' + txt;
    else if (e === 'fin') { mic.classList.remove('on'); live.textContent = Voz.manosLibres ? L('Manos libres activo', 'Hands-free on') : ''; }
    else if (e === 'error') { mic.classList.remove('on'); live.textContent = L('Micrófono: ', 'Mic: ') + txt; }
    else if (e === 'nosoporte') this.toast(L('Este navegador no permite hablarle. Probá con Chrome.', 'This browser has no speech input. Try Chrome.'));
    $('#hf').classList.toggle('hf', Voz.manosLibres);
  },
  estadoIA() { const e = $('#iaEstado'); if (e) e.textContent = IA.estado; const s = $('#iaPill'); if (s) s.textContent = IA.activa() ? '🤖 IA' : ''; },

  /* ---- PIN ---- */
  pedirPin() {
    return new Promise(res => {
      const m = $('#mPin'); m.classList.add('on'); const i = $('#pinIn'); i.value = ''; $('#pinErr').textContent = ''; setTimeout(() => i.focus(), 60);
      const ok = async () => { if (await sha256hex('motor' + i.value) === Cfg.pinHash) { m.classList.remove('on'); cleanup(); res(true); } else $('#pinErr').textContent = L('PIN incorrecto', 'Wrong PIN'); };
      const no = () => { m.classList.remove('on'); cleanup(); res(false); };
      const cleanup = () => { $('#pinOk').onclick = null; $('#pinNo').onclick = null; };
      $('#pinOk').onclick = ok; $('#pinNo').onclick = no; i.onkeydown = e => { if (e.key === 'Enter') ok(); };
    });
  },
  async abrirConfig() {
    if (!Auth.esDueno()) { this.toast(L('La configuración es solo para el dueño.', 'Settings are for the owner only.')); return; }
    if (Cfg.pinHash && !this.unlocked) { if (!(await this.pedirPin())) return; this.unlocked = true; }
    this.renderConfig(); $('#sCfg').classList.add('on');
  },

  bindConfig() {
    const setPath = (p, v) => { const k = p.split('.'); let o = Cfg; while (k.length > 1) o = o[k.shift()]; o[k[0]] = v; };
    $$('[data-cfg]', $('#cfgBody')).forEach(el => { el.onchange = el.oninput = () => {
      const p = el.dataset.cfg; let v = el.type === 'checkbox' ? el.checked : el.type === 'range' || el.type === 'number' ? parseFloat(el.value) : el.value;
      const antes = p === 'perfil' ? Cfg.perfil : null;
      setPath(p, v); guardarCfg();
      if (p === 'perfil' && v !== antes) { const pf = PERFILES[v]; Cfg.modulos = Object.fromEntries(Object.keys(MODULOS).map(m => [m, pf.modulos.includes(m)])); guardarCfg(); if (confirm(L('¿Cargar también los datos de ejemplo de este rubro? (reemplaza los datos actuales)', 'Also load sample data for this business type? (replaces current data)'))) { cargarDemo(v); Cfg.demoCargada = true; guardarCfg(); } this.renderConfig(); }
      if (p === 'idioma' || p === 'asistente' || p === 'perfil') this.renderConfig();
      this.marca(); if (p.startsWith('ia.')) { this.estadoIA(); }
    }; });
    $$('[data-mod]', $('#cfgBody')).forEach(el => el.onchange = () => { Cfg.modulos[el.dataset.mod] = el.checked; guardarCfg(); this.marca(); });
    $$('[data-u]', $('#cfgBody')).forEach(el => el.onchange = () => { const [i, k] = el.dataset.u.split('.'); Cfg.usuarios[i][k] = el.value; if (k === 'rol' && el.value === 'empleado' && !(Cfg.usuarios[i].modulos || []).length) Cfg.usuarios[i].modulos = ['chat', 'agenda', 'stock']; guardarCfg(); this.renderConfig(); this.marca(); });
    $$('[data-um]', $('#cfgBody')).forEach(el => el.onchange = () => { const [i, m] = el.dataset.um.split('.'); const l = new Set(Cfg.usuarios[i].modulos || []); el.checked ? l.add(m) : l.delete(m); Cfg.usuarios[i].modulos = [...l]; guardarCfg(); });
    $$('[data-udel]', $('#cfgBody')).forEach(el => el.onclick = () => { const i = +el.dataset.udel; if (Cfg.usuarioActual === Cfg.usuarios[i].id) Cfg.usuarioActual = Cfg.usuarios[0].id; Cfg.usuarios.splice(i, 1); guardarCfg(); this.renderConfig(); this.marca(); });
    $('#addUser').onclick = () => { Cfg.usuarios.push({ id: uid(), nombre: L('Nuevo usuario', 'New user'), rol: 'empleado', modulos: ['chat', 'agenda', 'stock'] }); guardarCfg(); this.renderConfig(); };
    $('#logoFile').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; Cfg.logo = await archivoADataUrl(f, 160); guardarCfg(); this.marca(); this.toast(L('Logo guardado', 'Logo saved')); };
    $('#probarVoz').onclick = () => Voz.hablar(L(`Hola, soy ${Cfg.asistente}. ¿Así me escuchás bien?`, `Hi, I'm ${Cfg.asistente}. Can you hear me well?`), true);
    $('#modeloFile').onchange = (e) => { const f = e.target.files[0]; if (f) IA.cargarLocal(f); };
    $('#cargarModelo').onclick = () => IA.cargarLocal(null);
    $('#probarOnline').onclick = async () => { const o = $('#probarRes'); o.textContent = '⏳ …'; const t0 = Date.now(); try { const r = await IA._online('Respondé solo: OK'); o.textContent = '✅ ' + (r || '(vacío)') + ' · ' + Cfg.ia.modelo + ' · ' + Math.round((Date.now() - t0) / 100) / 10 + ' s'; } catch (e) { o.textContent = '❌ ' + e.message; } };
    $('#modPerfil').onclick = () => { const pf = PERFILES[Cfg.perfil]; Cfg.modulos = Object.fromEntries(Object.keys(MODULOS).map(m => [m, pf.modulos.includes(m)])); guardarCfg(); this.renderConfig(); this.marca(); };
    $('#guardarChips').onclick = () => { const l = $('#chipsTxt').value.split('\n').map(x => x.split('|')).filter(a => a.length >= 2 && a[0].trim()).map(a => [a[0].trim(), a.slice(1).join('|').trim()]); Cfg.chips = l.length ? l : null; guardarCfg(); this.chips(); this.toast(L('Atajos guardados', 'Shortcuts saved')); };
    $('#guardarPin').onclick = async () => { const v = $('#pinNuevo').value.trim(); Cfg.pinHash = v ? await sha256hex('motor' + v) : ''; guardarCfg(); this.unlocked = true; this.toast(v ? L('PIN guardado', 'PIN saved') : L('PIN quitado', 'PIN removed')); };
    $('#licOk').onclick = async () => { const code = $('#licIn').value.trim(); const r = await Licencia.verificar(code); if (!r.ok) { this.toast(r.motivo); return; } Cfg.licencia = code; guardarCfg(); await Licencia.aplicar(); if (Licencia.datos && Licencia.datos.c && Cfg.negocio === 'Mi Negocio') Cfg.negocio = Licencia.datos.c; guardarCfg(); this.marca(); this.renderConfig(); this.toast(L('Licencia activada', 'License activated')); };
    $('#licNo').onclick = async () => { Cfg.licencia = ''; guardarCfg(); await Licencia.aplicar(); this.marca(); this.renderConfig(); };
    $('#expBackup').onclick = () => descargar(new Blob([JSON.stringify({ app: 'motor-ia', v: 1, cfg: { ...Cfg, pinHash: '' }, datos: Store.dump() }, null, 1)], { type: 'application/json' }), `copia-${Cfg.negocio.replace(/\W+/g, '_')}-${todayIso()}.json`);
    $('#impBackup').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; const j = safeJSON(await f.text(), null); if (!j || !j.datos) { this.toast(L('Archivo inválido', 'Invalid file')); return; } if (!confirm(L('Esto reemplaza los datos actuales. ¿Seguro?', 'This replaces current data. Sure?'))) return; Store.replaceAll(j.datos); this.toast(L('Copia importada', 'Backup imported')); this.refrescarDatos(); };
    $('#cargarDemo').onclick = () => { if (confirm(L('Esto reemplaza los datos actuales por ejemplos. ¿Seguro?', 'This replaces current data with samples. Sure?'))) { cargarDemo(Cfg.perfil); Cfg.demoCargada = true; guardarCfg(); this.toast(L('Datos de ejemplo cargados', 'Sample data loaded')); this.refrescarDatos(); } };
    $('#borrarTodo').onclick = () => { if (confirm(L('¿Borrar TODOS los datos? No se puede deshacer.', 'Delete ALL data? This cannot be undone.'))) { Store.clearAll(); ctx.undo = []; this.toast(L('Datos borrados', 'Data deleted')); this.refrescarDatos(); } };
    $('#fbConectar').onclick = async () => { const raw = $('#fbCfg').value.trim(); const c = safeJSON(raw.replace(/^[^{]*|[^}]*$/g, ''), null); if (!c || !c.projectId) { this.toast(L('Config inválida: pegá el objeto firebaseConfig', 'Invalid config')); return; } Cfg.firebase.config = raw; guardarCfg(); try { this.toast(L('Conectando…', 'Connecting…')); await Store.conectarFirebase(c, Cfg.firebase.email, $('#fbPass').value); this.toast(L('Conectado a Firebase ✔', 'Connected to Firebase ✔')); this.renderConfig(); this.refrescarDatos(); } catch (e) { this.toast('Firebase: ' + (e.message || e), 5000); } };
    $('#abrirImport').onclick = () => this.abrirImport();
  },

  /* ---- importar planilla ---- */
  abrirImport() { $('#sImp').classList.add('on'); $('#impTxt').value = ''; $('#impRes').innerHTML = ''; this._imp = null; },
  previewImport() {
    const t = $('#impTxt').value; if (!t.trim()) { $('#impRes').innerHTML = ''; return; }
    const r = importarTexto(t, $('#impTipo').value); this._imp = r;
    $('#impRes').innerHTML = `<div class="row"><b>${L('Se va a cargar como: ', 'Will be loaded as: ')}${r.tipo === 'stock' ? 'Stock' : ucf(lab('personas'))}</b><br><small>${L(`${r.total} filas · ${r.nuevos} nuevas · ${r.actualizados} actualizadas · ${r.salteados} salteadas`, `${r.total} rows · ${r.nuevos} new · ${r.actualizados} updated · ${r.salteados} skipped`)}</small></div>`;
  },
  confirmarImport() {
    const r = this._imp; if (!r || !r.tx.length) { this.toast(L('No hay nada para importar', 'Nothing to import')); return; }
    const inv = aplicarTx(r.tx); ctx.undo.push({ desc: L('Importación de planilla', 'Spreadsheet import'), inv });
    Store.add('log', { ts: new Date().toISOString(), user: nombreUsuario(), texto: L(`Importé ${r.nuevos} nuevos y actualicé ${r.actualizados} (${r.tipo})`, `Imported ${r.nuevos} new, ${r.actualizados} updated (${r.tipo})`) });
    $('#sImp').classList.remove('on'); $('#sCfg').classList.remove('on'); this.toast(L('Importado. Podés decir “deshacer”.', 'Imported. You can say “undo”.')); this.refrescarDatos(); this.bot(R(L(`Importé ${r.nuevos} nuevos y actualicé ${r.actualizados}.`, `Imported ${r.nuevos} new and updated ${r.actualizados}.`)), { mudo: true });
  },

  /* ---- recordatorios ---- */
  chequearRecordatorios() {
    const ahora = todayIso() + 'T' + nowHM();
    Store.all('recordatorios').filter(r => !r.hecho && !r.avisado && r.cuando <= ahora).forEach(r => {
      Store.update('recordatorios', r.id, { avisado: true });
      const msg = R(L('⏰ Recordatorio: ', '⏰ Reminder: ') + r.texto, { buttons: [{ label: L('✔ Hecho', '✔ Done'), run: () => { Store.update('recordatorios', r.id, { hecho: true }); return R(L('Listo.', 'Done.'), { refrescar: true }); } }, { label: L('Posponer 10 min', 'Snooze 10 min'), run: () => { const d = new Date(Date.now() + 600000); Store.update('recordatorios', r.id, { cuando: iso(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()), avisado: false }); return R(L('Te aviso en 10 minutos.', "I'll remind you in 10 minutes.")); } }] });
      this.bot(msg); this.alertas();
      try { if ('Notification' in window && Notification.permission === 'granted') new Notification(Cfg.negocio, { body: r.texto }); } catch (_) {}
    });
  },

  /* ---- inicio ---- */
  async iniciar() {
    Store.init('bike');
    if (!localStorage.getItem('motor_cfg')) { const pf = PERFILES[Cfg.perfil]; Cfg.modulos = Object.fromEntries(Object.keys(MODULOS).map(m => [m, pf.modulos.includes(m)])); guardarCfg(); }
    if (!Store.all('personas').length && !Cfg.demoCargada) { cargarDemo(Cfg.perfil); Cfg.demoCargada = true; guardarCfg(); }
    await Licencia.aplicar();
    if (Cfg.firebase.config) { const c = safeJSON(Cfg.firebase.config.replace(/^[^{]*|[^}]*$/g, ''), null); if (c) Store.conectarFirebase(c, '', '').catch(() => {}); }
    this.marca();
    $$('.tabs button').forEach(b => b.onclick = () => this.setTab(b.dataset.t));
    $('#send').onclick = () => { const v = $('#in').value; $('#in').value = ''; $('#in').style.height = ''; this.enviar(v); };
    $('#in').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#send').click(); } };
    $('#in').oninput = () => { const t = $('#in'); t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; };
    Voz.onTexto = (t) => this.enviar(t, true); Voz.onEstado = (e, t) => this.estadoVoz(e, t);
    $('#mic').onclick = () => { if (Voz.escuchando) Voz.detener(); else { Voz.parar(); Voz.escuchar(false); } };
    $('#hf').onclick = () => { const on = Voz.alternarManosLibres(); this.toast(on ? L('Manos libres activado' + (Cfg.voz.fraseActiva ? `: decí “${Voz.frase()}”` : ''), 'Hands-free on') : L('Manos libres apagado', 'Hands-free off')); this.estadoVoz('fin'); };
    $('#cfgBtn').onclick = () => this.abrirConfig(); $('#cfgCerrar').onclick = () => { $('#sCfg').classList.remove('on'); this.marca(); };
    $('#alertbar').onclick = () => this.enviar(L('alertas', 'alerts'));
    $('#datosQ').oninput = () => this.renderDatos();
    $('#foto').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const du = await archivoADataUrl(f, 1600); const r = preguntarFoto(f, du); this.yo('📷'); this.bot(r); } catch (er) { this.toast(String(er.message || er)); } };
    $('#attach').onclick = () => { if (!(moduloActivo('facturas') && Auth.puede('facturas'))) { this.toast(L('Las fotos no están activadas en esta app.', 'Photos are not enabled.')); return; } $('#foto').click(); };
    $('#impCerrar').onclick = () => $('#sImp').classList.remove('on'); $('#impTxt').oninput = () => this.previewImport(); $('#impTipo').onchange = () => this.previewImport(); $('#impOk').onclick = () => this.confirmarImport();
    $('#impFile').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { $('#impTxt').value = await leerArchivoTabla(f); this.previewImport(); } catch (er) { this.toast(String(er.message || er)); } };
    $('#userSel').onchange = async () => { const id = $('#userSel').value; const u = Cfg.usuarios.find(x => x.id === id); if (u.rol === 'dueno' && Cfg.pinHash) { if (!(await this.pedirPin())) { this.userSel(); return; } this.unlocked = true; } if (u.rol !== 'dueno') this.unlocked = false; Cfg.usuarioActual = id; guardarCfg(); this.marca(); this.userSel(); this.refrescarDatos(); this.toast(L('Usuario: ', 'User: ') + u.nombre); };
    this.userSel();
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { if ($('#sCfg').classList.contains('on')) this.renderConfig(); };
    // bienvenida
    this.bot(R(Cfg.tono === 'amigable' ? L(`¡Hola! Soy ${Cfg.asistente} 👋 Estoy para ayudarte con ${Cfg.negocio}. Probá con los atajos de abajo o escribime/hablame.`, `Hi! I'm ${Cfg.asistente} 👋`) : L(`Soy ${Cfg.asistente}. Escribí o hablame. “ayuda” muestra ejemplos.`, `I'm ${Cfg.asistente}. Type or talk to me. “help” shows examples.`)), { mudo: true });
    if (Cfg.resumenAuto && moduloActivo('reportes') && Auth.puede('reportes')) { const r = hReportes('resumen del dia', 'resumen del dia'); if (r) this.bot(r, { mudo: !Cfg.resumenHablado }); if (Cfg.resumenHablado) Voz.hablar(r.speak || r.text, true); }
    else if (moduloActivo('reportes')) this.bot(R(L('Si querés el resumen del día, decime “resumen”.', 'For the daily summary, say “summary”.')), { mudo: true });
    setInterval(() => this.chequearRecordatorios(), 15000); this.chequearRecordatorios();
    IA.autoCargarLocal();
    
    try { if ('Notification' in window && Notification.permission === 'default') $('#msgs').addEventListener('click', () => Notification.requestPermission(), { once: true }); } catch (_) {}
  },
  userSel() { const s = $('#userSel'); s.innerHTML = Cfg.usuarios.map(u => `<option value="${u.id}" ${u.id === Cfg.usuarioActual ? 'selected' : ''}>${esc(u.nombre)}</option>`).join(''); }
};

window.addEventListener('DOMContentLoaded',()=>UI.iniciar());
</script></body></html>
