<script>
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayIso = () => iso(new Date());
const addDays = (n, from) => { const d = from ? new Date(from + 'T12:00:00') : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const nowHM = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ucf = s => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);
const cap = s => String(s || '').replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());
const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s:\/.,$%+@#-]/g, ' ').replace(/\s+/g, ' ').trim();
const STOP = new Set(['de', 'del', 'la', 'el', 'los', 'las', 'un', 'una', 'y', 'e', 'a', 'al', 'en', 'para', 'con', 'por', 'the', 'of', 'and', 'to', 'for', 'with']);
const stem = t => t.length > 4 ? t.replace(/(es|s)$/, '') : t.replace(/s$/, '');
const toks = s => norm(s).split(/[\s,.:;/-]+/).filter(Boolean);
const sigToks = s => toks(s).filter(t => !STOP.has(t));

function lev(a, b) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > 3) return 9;
  const m = []; for (let i = 0; i <= a.length; i++) m[i] = [i];
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return m[a.length][b.length];
}
function tokEq(a, b) {
  if (a === b) return 1;
  const sa = stem(a), sb = stem(b);
  if (sa === sb) return 1;
  const L = Math.min(sa.length, sb.length);
  if (L >= 4 && lev(sa, sb) <= (L >= 8 ? 2 : 1)) return 0.8;
  return 0;
}
/* Cuánto de los tokens de `name` aparecen en la frase `q` (0..1) */
function mentionScore(q, name) {
  const qt = toks(q), nt = sigToks(name);
  if (!nt.length) return 0;
  let hit = 0;
  for (const t of nt) { let best = 0; for (const x of qt) best = Math.max(best, tokEq(x, t)); hit += best; }
  return hit / nt.length;
}

const parseNum = (s) => {
  s = String(s == null ? '' : s).replace(/[$\s]/g, '');
  if (!s) return NaN;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return parseFloat(s.replace(/\./g, '').replace(',', '.'));
  if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return parseFloat(s.replace(/,/g, ''));
  return parseFloat(s.replace(',', '.'));
};
const WORDNUM = { un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, quince: 15, veinte: 20, treinta: 30, cuarenta: 40, cincuenta: 50, cien: 100, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, twelve: 12, twenty: 20 };
const numerosAPalabra = q => q.replace(/\b(uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|quince|veinte|treinta|cuarenta|cincuenta|cien|one|two|three|four|five|six|seven|eight|nine|ten|twelve|twenty)\b(?=\s+[a-z])/g, (m, w) => WORDNUM[w]);
const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

const DIAS_ES = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
const DIAS_EN = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const DIAS_TXT = { es: ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] };
const fmtFecha = (isoStr, lang) => {
  if (!isoStr) return '';
  const [y, m, d] = isoStr.split('-');
  const dow = new Date(isoStr + 'T12:00:00').getDay();
  const base = `${d}/${m}/${y}`;
  return `${DIAS_TXT[lang || 'es'][dow]} ${base}`;
};
const fmtFechaCorta = isoStr => { const [y, m, d] = isoStr.split('-'); return `${d}/${m}/${y}`; };

/* Busca una fecha dentro de q (ya normalizado). Devuelve {iso, rest, rango?} o null */
function parseFecha(q) {
  const hoy = todayIso();
  let m;
  const cut = (re, iso_, extra) => ({ iso: iso_, rest: q.replace(re, ' ').replace(/\s+/g, ' ').trim(), ...extra });
  if ((m = q.match(/\b(pasado manana|day after tomorrow)\b/))) return cut(/\b(pasado manana|day after tomorrow)\b/, addDays(2));
  if ((m = q.match(/\b(manana|tomorrow)\b/))) return cut(/\b(manana|tomorrow)\b/, addDays(1));
  if ((m = q.match(/\b(hoy|today)\b/))) return cut(/\b(hoy|today)\b/, hoy);
  if ((m = q.match(/\b(anteayer|antes de ayer)\b/))) return cut(/\b(anteayer|antes de ayer)\b/, addDays(-2));
  if ((m = q.match(/\b(ayer|yesterday)\b/))) return cut(/\b(ayer|yesterday)\b/, addDays(-1));
  if ((m = q.match(/\b(esta semana|this week)\b/))) return cut(/\b(esta semana|this week)\b/, hoy, { rango: 'semana' });
  if ((m = q.match(/\b(la semana que viene|proxima semana|next week)\b/))) return cut(/\b(la semana que viene|proxima semana|next week)\b/, addDays(7), { rango: 'semana' });
  if ((m = q.match(/\b(este mes|this month)\b/))) return cut(/\b(este mes|this month)\b/, hoy, { rango: 'mes' });
  if ((m = q.match(/\ben (\d{1,2}) (dias|dia|days|day)\b/))) return cut(/\ben (\d{1,2}) (dias|dia|days|day)\b/, addDays(parseInt(m[1])));
  if ((m = q.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/))) {
    let [_, d, mo, y] = m; d = +d; mo = +mo;
    if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12) {
      let yy = y ? (y.length === 2 ? 2000 + +y : +y) : new Date().getFullYear();
      let cand = `${yy}-${pad2(mo)}-${pad2(d)}`;
      if (!y && cand < hoy && (new Date(hoy) - new Date(cand)) > 180 * 864e5) cand = `${yy + 1}-${pad2(mo)}-${pad2(d)}`;
      return cut(m[0], cand);
    }
  }
  const re = new RegExp(`\\b(?:(?:on|el|la|este|esta|this)\\s+)?(?:(proximo|proxima|next)\\s+)?(${[...DIAS_ES, ...DIAS_EN].join('|')})\\b`);
  if ((m = q.match(re))) {
    const w = m[2]; let dow = DIAS_ES.indexOf(w); if (dow < 0) dow = DIAS_EN.indexOf(w);
    const now = new Date().getDay();
    let diff = (dow - now + 7) % 7;
    if (diff === 0 && /^(proximo|proxima|next)$/.test(m[1] || '')) diff = 7;
    return { iso: addDays(diff), rest: q.replace(m[0], ' ').replace(/\s+/g, ' ').trim() };
  }
  if ((m = q.match(/\b(?:el|dia|on the)\s+(\d{1,2})\b(?!\s*(?:[:h]|pm|am))/))) {
    const d = parseInt(m[1]);
    if (d >= 1 && d <= 31) {
      const n = new Date(); let y = n.getFullYear(), mo = n.getMonth() + 1;
      let cand = `${y}-${pad2(mo)}-${pad2(d)}`;
      if (cand < hoy) { mo++; if (mo > 12) { mo = 1; y++; } cand = `${y}-${pad2(mo)}-${pad2(d)}`; }
      return { iso: cand, rest: q.replace(m[0], ' ').replace(/\s+/g, ' ').trim() };
    }
  }
  return null;
}
/* Hora: "a las 15", "15:30", "3 pm", "3 de la tarde". Devuelve {hm, rest} */
function parseHora(q) {
  let m;
  const done = (h, mi, re) => { if (h > 23 || mi > 59) return null; return { hm: `${pad2(h)}:${pad2(mi)}`, rest: q.replace(re, ' ').replace(/\s+/g, ' ').trim() }; };
  let re;
  re = /\b(?:a la|a las|a|at|@)?\s*(\d{1,2})[:.h](\d{2})\s*(am|pm|hs|hrs|h)?\b/;
  if ((m = q.match(re)) && (m[3] || /[:h]/.test(m[0]) || /a las|a la|at|@/.test(m[0]))) {
    let h = +m[1]; const mi = +m[2];
    if (m[3] === 'pm' && h < 12) h += 12; if (m[3] === 'am' && h === 12) h = 0;
    const r = done(h, mi, re); if (r) return r;
  }
  re = /\b(?:at\s+|@\s*)?(\d{1,2})\s*(am|pm)\b/;
  if ((m = q.match(re))) { let h = +m[1]; if (m[2] === 'pm' && h < 12) h += 12; if (m[2] === 'am' && h === 12) h = 0; const r = done(h, 0, re); if (r) return r; }
  re = /\b(?:a la|a las|at)\s+(\d{1,2})(?:\s*(hs|hrs|h))?(?:\s+de la\s+(manana|tarde|noche))?\b/;
  if ((m = q.match(re))) {
    let h = +m[1];
    if (m[3] && m[3] !== 'manana' && h < 12) h += 12;
    const r = done(h, 0, re); if (r) return r;
  }
  re = /\b(\d{1,2})\s*(hs|hrs)\b/;
  if ((m = q.match(re))) { const r = done(+m[1], 0, re); if (r) return r; }
  return null;
}
const rangoFechas = (f) => {
  if (!f) return null;
  if (f.rango === 'semana') { const d = new Date(f.iso + 'T12:00:00'); const dow = (d.getDay() + 6) % 7; return [addDays(-dow, f.iso), addDays(6 - dow, f.iso)]; }
  if (f.rango === 'mes') { const [y, m] = f.iso.split('-'); const last = new Date(+y, +m, 0).getDate(); return [`${y}-${m}-01`, `${y}-${m}-${pad2(last)}`]; }
  return [f.iso, f.iso];
};

/* hash/crypto */
async function sha256hex(s) {
  const b = new TextEncoder().encode(s);
  if (window.crypto && crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', b); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'x' + (h >>> 0).toString(16);
}
async function hmacHex(secret, msg) {
  if (!(window.crypto && crypto.subtle)) return sha256hex(secret + msg);
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg));
  return [...new Uint8Array(sig)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

/* ============ Datos: almacenamiento (local o Firebase) + transacciones con deshacer ============ */
const COLS = ['personas', 'stock', 'agenda', 'servicios', 'accesos', 'recordatorios', 'facturas', 'plantillas', 'log'];

const Store = {
  prefix: 'motor_',
  cache: {},
  backend: 'local',      // 'local' | 'firebase'
  fb: null,
  init(appId) {
    this.prefix = 'motor_' + (appId || 'app') + '_';
    for (const c of COLS) this.cache[c] = lsGet(this.prefix + c, []);
  },
  all(c) { return this.cache[c] || (this.cache[c] = []); },
  get(c, id) { return this.all(c).find(x => x.id === id); },
  _persist(c) { lsSet(this.prefix + c, this.all(c)); },
  add(c, doc) {
    doc = { ...doc, id: doc.id || uid() };
    this.all(c).push(doc); this._persist(c); this._fb('set', c, doc); return doc;
  },
  update(c, id, patch) {
    const d = this.get(c, id); if (!d) return null;
    Object.assign(d, patch); this._persist(c); this._fb('set', c, d); return d;
  },
  remove(c, id) {
    const a = this.all(c); const i = a.findIndex(x => x.id === id); if (i < 0) return false;
    a.splice(i, 1); this._persist(c); this._fb('del', c, { id }); return true;
  },
  clearAll() { for (const c of COLS) { this.cache[c] = []; this._persist(c); } },
  replaceAll(data) { for (const c of COLS) { this.cache[c] = Array.isArray(data[c]) ? data[c] : []; this._persist(c); } },
  dump() { const o = {}; for (const c of COLS) o[c] = this.all(c); return o; },

  /* ---- Firebase (opcional): mantiene la misma API síncrona con caché local ---- */
  async conectarFirebase(config, user, pass) {
    const V = '10.12.2';
    const [{ initializeApp }, { getAuth, signInWithEmailAndPassword }, F] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
    ]);
    const app = initializeApp(config, 'motor');
    if (user && pass) await signInWithEmailAndPassword(getAuth(app), user, pass);
    const db = F.getFirestore(app);
    this.fb = { F, db, unsubs: [] };
    for (const c of COLS) {
      const col = F.collection(db, 'motor_' + c);
      await new Promise(res => {
        let first = true;
        const un = F.onSnapshot(col, snap => {
          this.cache[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
          this._persist(c);
          if (first) { first = false; res(); } else if (window.UI) UI.refrescarDatos();
        }, err => { console.warn('Firestore', c, err.message); if (first) { first = false; res(); } });
        this.fb.unsubs.push(un);
      });
    }
    this.backend = 'firebase';
  },
  _fb(op, c, doc) {
    if (!this.fb) return;
    const { F, db } = this.fb;
    try {
      if (op === 'set') { const { id, ...rest } = doc; F.setDoc(F.doc(db, 'motor_' + c, id), JSON.parse(JSON.stringify(rest))); }
      else F.deleteDoc(F.doc(db, 'motor_' + c, doc.id));
    } catch (e) { console.warn('fb', e); }
  }
};

function bk_toFirestoreValue(v){
  if(v === null || v === undefined) return { nullValue: null };
  if(typeof v === 'string') return { stringValue: v };
  if(typeof v === 'boolean') return { booleanValue: v };
  if(typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if(Array.isArray(v)) return { arrayValue: { values: v.map(bk_toFirestoreValue) } };
  if(typeof v === 'object') return { mapValue: { fields: bk_toFirestoreFields(v) } };
  return { stringValue: String(v) };
}

function bk_toFirestoreFields(obj){
  const out = {};
  for(const k in obj) out[k] = bk_toFirestoreValue(obj[k]);
  return out;
}

function bk_fromFirestoreValue(v){
  if(!v) return null;
  if('stringValue' in v) return v.stringValue;
  if('booleanValue' in v) return v.booleanValue;
  if('integerValue' in v) return parseInt(v.integerValue, 10);
  if('doubleValue' in v) return v.doubleValue;
  if('nullValue' in v) return null;
  if('arrayValue' in v) return (v.arrayValue.values || []).map(bk_fromFirestoreValue);
  if('mapValue' in v) return bk_fromFirestoreFields(v.mapValue.fields || {});
  return null;
}

function bk_fromFirestoreFields(fields){
  const out = {};
  for(const k in fields) out[k] = bk_fromFirestoreValue(fields[k]);
  return out;
}

async function bk_fsGet(projectId, path){
  const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/default/documents/${path}`;
  const res = await fetch(url);
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('No se pudo leer de Firestore (código ' + res.status + '). Revisá que el projectId sea correcto y que las reglas de Firestore permitan lectura.');
  const data = await res.json();
  return data.fields ? bk_fromFirestoreFields(data.fields) : {};
}

async function bk_fsSet(projectId, path, obj){
  const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/default/documents/${path}`;
  const res = await fetch(url, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: bk_toFirestoreFields(obj || {}) })
  });
  if(res.ok) return;
  if(res.status === 404){
    // El documento todavía no existe: lo creamos explícitamente con POST.
    const parts = path.split('/');
    const docId = parts.pop();
    const collectionPath = parts.join('/');
    const createUrl = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/default/documents/${collectionPath}?documentId=${encodeURIComponent(docId)}`;
    const createRes = await fetch(createUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: bk_toFirestoreFields(obj || {}) })
    });
    if(createRes.ok) return;
    if(createRes.status === 409){
      // Ya existe (se creó entre medio): reintentamos el PATCH una vez.
      const retryRes = await fetch(url, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: bk_toFirestoreFields(obj || {}) })
      });
      if(retryRes.ok) return;
      throw new Error('No se pudo escribir en Firestore (código ' + retryRes.status + ').');
    }
    throw new Error('No se pudo crear el documento en Firestore (código ' + createRes.status + ').');
  }
  throw new Error('No se pudo escribir en Firestore (código ' + res.status + ').');
}

/* ===== Puente con BIKE MPV: mismos datos (mismo sitio, misma memoria del navegador) ===== */
window.BIKE_MODE = true;
const BIKE_KEY = 'bikempv_state_v1';
const BK = {
  ld() { const s = safeJSON(localStorage.getItem(BIKE_KEY), null) || {}; s.jobs = s.jobs || []; s.parts = s.parts || []; s.quotes = s.quotes || []; s.cancelados = s.cancelados || []; return s; },
  fbId() { try { const c = JSON.parse(localStorage.getItem('bikempv_firebase_config_v1') || 'null'); return c && c.projectId; } catch (_) { return null; } },
  sv(s) { try { localStorage.setItem(BIKE_KEY, JSON.stringify(s)); } catch (_) {} const id = BK.fbId(); if (id) { clearTimeout(BK._t); BK._t = setTimeout(() => { bk_fsSet(id, 'bikempv/state', s).catch(() => {}); }, 400); } },
  pid: n => 'c_' + norm(n).replace(/\s+/g, '_'),
  est: { pendiente: 'pendiente', confirmado: 'pendiente', 'en curso': 'progreso', listo: 'listo', entregado: 'entregado', realizado: 'entregado' },
  estInv: { pendiente: 'pendiente', progreso: 'en curso', listo: 'listo', entregado: 'entregado' },
  ag(j, canc) { return { id: j.id, fecha: j.fechaEntrega || j.fechaIngreso || '', hora: j.hora || '', personaId: BK.pid(j.cliente), personaNombre: j.cliente || '', titulo: j.descripcion || j.bici || '', objeto: j.bici || '', estado: canc ? 'cancelado' : (BK.estInv[j.estado] || 'pendiente') }; },
  part(p) { return { id: p.id, nombre: p.nombre, categoria: p.categoria || '', cantidad: p.cantidad, precio: p.precioFinal || 0, minimo: p.minimo }; }
};
(async () => { const id = BK.fbId(); if (!id) return; try { const r = await bk_fsGet(id, 'bikempv/state'); if (r && r.jobs) localStorage.setItem(BIKE_KEY, JSON.stringify(r)); } catch (_) {} })();
(function () {
  const BR = new Set(['stock', 'agenda', 'servicios', 'personas']);
  const raw = c => Store.cache[c] || (Store.cache[c] = []);
  const o = {
    all: raw,
    add(c, doc) { doc = { ...doc, id: doc.id || uid() }; raw(c).push(doc); Store._persist(c); return doc; },
    update(c, id, patch) { const d = raw(c).find(x => x.id === id); if (!d) return null; Object.assign(d, patch); Store._persist(c); return d; },
    remove(c, id) { const a = raw(c); const i = a.findIndex(x => x.id === id); if (i < 0) return false; a.splice(i, 1); Store._persist(c); return true; }
  };
  const jobDesde = (doc, s) => {
    const per = o.all('personas').find(p => p.id === doc.personaId) || {};
    return { id: doc.id || uid(), cliente: doc.personaNombre || per.nombre || '', telefono: per.telefono || doc.telefono || '', bici: doc.objeto || '', estado: BK.est[doc.estado] || 'pendiente', descripcion: doc.titulo || '', fechaIngreso: doc.fecha || todayIso(), fechaEntrega: doc.fecha || todayIso(), presupuesto: 0, partsUsed: [], hora: doc.hora || '' };
  };
  Store.all = function (c) {
    if (!BR.has(c)) return o.all(c);
    const s = BK.ld();
    if (c === 'stock') return s.parts.map(BK.part);
    if (c === 'agenda') return s.jobs.map(j => BK.ag(j, false)).concat(s.cancelados.map(j => BK.ag(j, true)));
    if (c === 'servicios') {
      const der = s.jobs.filter(j => j.estado === 'listo' || j.estado === 'entregado').map(j => ({ id: 'j_' + j.id, fecha: j.fechaEntrega || j.fechaIngreso || '', personaId: BK.pid(j.cliente), personaNombre: j.cliente || '', objeto: j.bici || '', detalle: j.descripcion || 'Trabajo', importe: j.presupuesto || 0 }));
      return der.concat(o.all('servicios'));
    }
    const loc = o.all('personas'); const vistos = new Set(loc.map(p => norm(p.nombre))); const der = [];
    s.jobs.concat(s.quotes).forEach(x => { const n = (x.cliente || '').trim(); if (n && !vistos.has(norm(n))) { vistos.add(norm(n)); der.push({ id: BK.pid(n), nombre: n, telefono: x.telefono || '', alias: [], nota: x.bici || '' }); } });
    return loc.concat(der);
  };
  Store.get = function (c, id) { return Store.all(c).find(x => x.id === id); };
  Store.add = function (c, doc) {
    if (c === 'stock') { const s = BK.ld(); const p = { id: doc.id || uid(), nombre: doc.nombre, categoria: doc.categoria || '', cantidad: Math.max(0, +doc.cantidad || 0), precioCosto: 0, precioBonificado: 0, precioFinal: +doc.precio || 0, minimo: doc.minimo }; s.parts.push(p); BK.sv(s); return BK.part(p); }
    if (c === 'agenda') { const s = BK.ld(); const j = jobDesde(doc, s); s.jobs.push(j); BK.sv(s); return BK.ag(j, false); }
    return o.add(c, doc);
  };
  Store.update = function (c, id, patch) {
    if (c === 'stock') { const s = BK.ld(); const p = s.parts.find(x => x.id === id); if (!p) return null; if ('nombre' in patch) p.nombre = patch.nombre; if ('categoria' in patch) p.categoria = patch.categoria; if ('cantidad' in patch) p.cantidad = Math.max(0, +patch.cantidad || 0); if ('precio' in patch) p.precioFinal = +patch.precio || 0; if ('minimo' in patch) p.minimo = patch.minimo; BK.sv(s); return BK.part(p); }
    if (c === 'agenda') {
      const s = BK.ld(); let canc = false; let i = s.jobs.findIndex(x => x.id === id); let j = s.jobs[i];
      if (!j) { i = s.cancelados.findIndex(x => x.id === id); j = s.cancelados[i]; canc = true; }
      if (!j) return null;
      if ('fecha' in patch) { j.fechaEntrega = patch.fecha; if (!j.fechaIngreso) j.fechaIngreso = patch.fecha; }
      if ('hora' in patch) j.hora = patch.hora; if ('titulo' in patch) j.descripcion = patch.titulo; if ('personaNombre' in patch) j.cliente = patch.personaNombre; if ('objeto' in patch) j.bici = patch.objeto;
      if ('estado' in patch) {
        if (patch.estado === 'cancelado' && !canc) { s.jobs.splice(i, 1); s.cancelados.push(j); canc = true; }
        else if (patch.estado !== 'cancelado') { if (canc) { s.cancelados.splice(i, 1); s.jobs.push(j); canc = false; } j.estado = BK.est[patch.estado] || 'pendiente'; }
      }
      BK.sv(s); return BK.ag(j, canc);
    }
    if (c === 'servicios' && String(id).startsWith('j_')) { const s = BK.ld(); const j = s.jobs.find(x => 'j_' + x.id === id); if (!j) return null; if ('fecha' in patch) j.fechaEntrega = patch.fecha; if ('detalle' in patch) j.descripcion = patch.detalle; if ('importe' in patch) j.presupuesto = +patch.importe || 0; if ('objeto' in patch) j.bici = patch.objeto; BK.sv(s); return Store.get('servicios', id); }
    if (c === 'personas') {
      if (!o.all('personas').find(p => p.id === id)) { const d = Store.all('personas').find(p => p.id === id); if (!d) return null; o.add('personas', { ...d }); }
    }
    return o.update(c, id, patch);
  };
  Store.remove = function (c, id) {
    if (c === 'stock') { const s = BK.ld(); const n = s.parts.length; s.parts = s.parts.filter(x => x.id !== id); BK.sv(s); return s.parts.length < n; }
    if (c === 'agenda') { const s = BK.ld(); const n = s.jobs.length + s.cancelados.length; s.jobs = s.jobs.filter(x => x.id !== id); s.cancelados = s.cancelados.filter(x => x.id !== id); BK.sv(s); return s.jobs.length + s.cancelados.length < n; }
    if (c === 'servicios' && String(id).startsWith('j_')) { const s = BK.ld(); const n = s.jobs.length; s.jobs = s.jobs.filter(x => 'j_' + x.id !== id); BK.sv(s); return s.jobs.length < n; }
    return o.remove(c, id);
  };
  const LOC = COLS.filter(c => !['stock', 'agenda'].includes(c));
  Store.clearAll = function () { for (const c of LOC) { this.cache[c] = []; this._persist(c); } };
  Store.replaceAll = function (data) { for (const c of LOC) { let a = Array.isArray(data[c]) ? data[c] : []; if (c === 'servicios') a = a.filter(x => !String(x.id).startsWith('j_')); if (c === 'personas') a = a.filter(x => !String(x.id).startsWith('c_')); this.cache[c] = a; this._persist(c); } };
  Store.dump = function () { const d = {}; for (const c of COLS) d[c] = Store.all(c); return d; };
})();

/* Transacciones: lista de operaciones. Aplicar devuelve la transacción inversa (para deshacer). */
function aplicarTx(tx) {
  const inv = [];
  for (const op of tx) {
    if (op.op === 'add') { const d = Store.add(op.col, op.doc); inv.unshift({ op: 'del', col: op.col, id: d.id }); op.doc = d; }
    else if (op.op === 'upd') {
      const before = Store.get(op.col, op.id); if (!before) continue;
      const prev = {}; for (const k of Object.keys(op.patch)) prev[k] = before[k];
      Store.update(op.col, op.id, op.patch); inv.unshift({ op: 'upd', col: op.col, id: op.id, patch: prev });
    } else if (op.op === 'del') {
      const before = Store.get(op.col, op.id); if (!before) continue;
      const copy = JSON.parse(JSON.stringify(before)); Store.remove(op.col, op.id); inv.unshift({ op: 'add', col: op.col, doc: copy });
    }
  }
  return inv;
}

/* Licencia: código = base64url(JSON) + "." + firma. Sin licencia = modo demo (todo activo, con aviso). */
const Licencia = {
  datos: null, estado: 'demo',
  async verificar(codigo) {
    try {
      const [p, f] = String(codigo || '').trim().split('.');
      if (!p || !f) return { ok: false, motivo: L('Código inválido', 'Invalid code') };
      const firma = (await hmacHex(SECRETO_LICENCIA, p)).slice(0, 20);
      if (firma !== f) return { ok: false, motivo: L('Código inválido', 'Invalid code') };
      const d = safeJSON(unb64u(p), null); if (!d) return { ok: false, motivo: L('Código inválido', 'Invalid code') };
      if (d.v && d.v < todayIso()) return { ok: false, motivo: L('Licencia vencida el ', 'License expired on ') + fmtFechaCorta(d.v), datos: d };
      return { ok: true, datos: d };
    } catch (_) { return { ok: false, motivo: L('Código inválido', 'Invalid code') }; }
  },
  async aplicar() {
    if (!Cfg.licencia) { this.datos = null; this.estado = 'demo'; return; }
    const r = await this.verificar(Cfg.licencia);
    if (r.ok) { this.datos = r.datos; this.estado = 'ok'; }
    else { this.datos = r.datos || null; this.estado = r.datos ? 'vencida' : 'invalida'; }
  },
  permite(mod) { if (this.estado === 'demo') return true; if (this.estado !== 'ok') return false; return !this.datos.m || this.datos.m.includes(mod); },
  async generar(cliente, vence, modulos) {
    const p = b64u(JSON.stringify({ c: cliente, v: vence || '', m: modulos && modulos.length ? modulos : null }));
    return p + '.' + (await hmacHex(SECRETO_LICENCIA, p)).slice(0, 20);
  }
};

/* ============ Voz: hablarle y que te hable (opcional) ============ */
const Voz = {
  SR: window.SpeechRecognition || window.webkitSpeechRecognition,
  rec: null, escuchando: false, manosLibres: false, hablando: false, onTexto: null, onEstado: null,
  soportaEntrada() { return !!this.SR; },
  soportaSalida() { return 'speechSynthesis' in window; },
  langCode() { return Cfg.idioma === 'en' ? 'en-US' : 'es-AR'; },
  voces() { try { return speechSynthesis.getVoices() || []; } catch (_) { return []; } },
  vocesDelIdioma() {
    const l = Cfg.idioma === 'en' ? 'en' : 'es';
    return this.voces().filter(v => (v.lang || '').toLowerCase().startsWith(l));
  },
  limpiar(t) {
    return String(t).replace(/<[^>]+>/g, ' ').replace(/[*_`#>]/g, '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
      .replace(/\$\s?([\d.,]+)/g, (m, n) => n + ' pesos').replace(/\s+/g, ' ').trim();
  },
  hablar(texto, forzar) {
    if (!this.soportaSalida() || !(Cfg.voz.hablar || forzar)) { this._despuesDeHablar(); return; }
    const t = this.limpiar(texto); if (!t) { this._despuesDeHablar(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t.slice(0, 600));
      u.lang = this.langCode();
      const v = this.voces().find(x => x.voiceURI === Cfg.voz.voiceURI);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = Cfg.voz.velocidad || 1; u.volume = Cfg.voz.volumen == null ? 1 : Cfg.voz.volumen;
      this.hablando = true;
      if (this.escuchando && this.rec) { try { this.rec.stop(); } catch (_) {} }
      u.onend = u.onerror = () => { this.hablando = false; this._despuesDeHablar(); };
      speechSynthesis.speak(u);
    } catch (_) { this.hablando = false; this._despuesDeHablar(); }
  },
  parar() { try { speechSynthesis.cancel(); } catch (_) {} this.hablando = false; },
  _despuesDeHablar() { if (this.manosLibres && !this.escuchando) setTimeout(() => this.escuchar(true), 250); },

  /* Palabra de activación (opcional): solo se usa en manos libres */
  frase() { return norm(Cfg.voz.fraseTexto || ('oye ' + Cfg.asistente)); },
  /* Devuelve el texto sin la frase, '' si solo dijo la frase, o null si no la dijo */
  aplicarFrase(texto) {
    if (!(this.manosLibres && Cfg.voz.fraseActiva)) return texto;
    const q = norm(texto), f = this.frase();
    const i = q.indexOf(f);
    if (i >= 0) return q.slice(i + f.length).replace(/^[\s,.:;!-]+/, '');
    return null;
  },

  escuchar(continuo) {
    if (!this.SR) { if (this.onEstado) this.onEstado('nosoporte'); return; }
    if (this.escuchando) return;
    const r = new this.SR();
    r.lang = this.langCode(); r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    let final = '';
    r.onstart = () => { this.escuchando = true; if (this.onEstado) this.onEstado('escuchando'); };
    r.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) final += t; else interim += t;
      }
      if (this.onEstado) this.onEstado('parcial', final + interim);
    };
    r.onerror = (e) => { if (this.onEstado) this.onEstado('error', e.error); if (e.error === 'not-allowed' || e.error === 'service-not-allowed') this.manosLibres = false; };
    r.onend = () => {
      this.escuchando = false;
      const t = final.trim(); final = '';
      if (this.onEstado) this.onEstado('fin');
      if (t) { const u = this.aplicarFrase(t); if (u === null) { if (this.manosLibres && !this.hablando) setTimeout(() => this.escuchar(true), 300); } else if (u === '') { this.hablar(Cfg.idioma === 'en' ? 'Yes?' : 'Decime.', true); } else if (this.onTexto) this.onTexto(u, true); }
      else if (this.manosLibres && !this.hablando) setTimeout(() => this.escuchar(true), 400);
    };
    this.rec = r;
    try { r.start(); } catch (_) {}
  },
  detener() { this.manosLibres = false; try { if (this.rec) this.rec.stop(); } catch (_) {} this.escuchando = false; this.parar(); if (this.onEstado) this.onEstado('fin'); },
  alternarManosLibres() {
    this.manosLibres = !this.manosLibres;
    if (this.manosLibres) { this.escuchar(true); } else this.detener();
    return this.manosLibres;
  }
};

/* ============ IA opcional: Gemma local (MediaPipe) o en línea (Gemini). Sin IA, el motor igual funciona con reglas ============ */
const MP_VER = '0.10.27';
const IA = {
  llm: null, estado: 'sin modelo', cargando: false,

  /* ---- guardar el archivo del modelo en el navegador para no elegirlo cada vez ---- */
  _idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('motor-ia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async _kvGet(k) { try { const db = await this._idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (_) { return null; } },
  async _kvSet(k, v) { try { const db = await this._idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (_) { return false; } },

  async cargarLocal(file) {
    if (this.cargando) return;
    this.cargando = true; this.estado = 'cargando modelo…'; UI && UI.estadoIA();
    try {
      let mod;
      try { mod = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VER}/genai_bundle.mjs`); }
      catch (_) { mod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai'); }
      const { FilesetResolver, LlmInference } = mod;
      const genai = await FilesetResolver.forGenAiTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VER}/wasm`);
      let blob = file;
      if (!blob) blob = await this._kvGet('modelo');
      if (!blob) throw new Error('Elegí el archivo del modelo (.task o .litertlm).');
      if (file) await this._kvSet('modelo', file);
      this.llm = await LlmInference.createFromOptions(genai, {
        baseOptions: { modelAssetBuffer: blob.stream().getReader() },
        maxTokens: 1024, topK: 40, temperature: 0.2, randomSeed: 7
      });
      this.estado = 'listo (' + (blob.name || 'modelo guardado') + ')';
    } catch (e) {
      this.llm = null; this.estado = 'error: ' + (e.message || e);
    }
    this.cargando = false; UI && UI.estadoIA();
  },
  async autoCargarLocal() { if (Cfg.ia.modo === 'local' || Cfg.ia.modo === 'local+online') { const b = await this._kvGet('modelo'); if (b) this.cargarLocal(null); } },

  async _local(prompt) {
    if (!this.llm) throw new Error('Gemma local no está cargado');
    const p = `<start_of_turn>user\n${prompt}<end_of_turn>\n<start_of_turn>model\n`;
    return String(await this.llm.generateResponse(p)).trim();
  },
  async _online(prompt, imagenes) {
    const k = Cfg.ia.key; if (!k) throw new Error('Falta la clave de la API');
    const parts = [{ text: prompt }];
    for (const im of (imagenes || [])) { const m = String(im).match(/^data:(.+?);base64,(.+)$/); if (m) parts.push({ inline_data: { mime_type: m[1], data: m[2] } }); }
    const base = 'https://generativelanguage.googleapis.com/v1beta/';
    const llamar = (mod) => fetch(base + 'models/' + encodeURIComponent(mod) + ':generateContent', {
      signal: AbortSignal.timeout(14000), method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': k },
      body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: { temperature: 0.2 } })
    });
    let r; const seguro = async (m) => { try { return await llamar(m); } catch (e) { return { ok: false, status: 0, json: async () => ({ error: { message: e.name === 'TimeoutError' ? 'tardó demasiado' : e.message } }) }; } };
    r = await seguro(Cfg.ia.modelo || 'gemini-flash-latest');
    if (!r.ok && [0, 404, 429, 500, 503].includes(r.status)) {
      /* modelo inexistente o saturado: probar otros disponibles (primero los "lite" y los de nombre fijo) */
      const probados = [Cfg.ia.modelo || 'gemini-flash-latest'];
      let cand = ['gemini-flash-lite-latest'];
      try {
        const lr = await fetch(base + 'models?pageSize=200', { signal: AbortSignal.timeout(15000), headers: { 'x-goog-api-key': k } });
        if (lr.ok) {
          const ms = ((await lr.json()).models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /^models\/gemini-[\d.]+-flash(-lite)?$/.test(m.name));
          ms.sort((x, y) => parseFloat(y.name.match(/gemini-([\d.]+)/)[1]) - parseFloat(x.name.match(/gemini-([\d.]+)/)[1]) || (x.name.includes('lite') ? 1 : -1));
          cand = cand.concat(ms.map(m => m.name.replace('models/', '')));
        }
      } catch (_) {}
      for (const nuevo of cand) {
        if (probados.includes(nuevo) || probados.length > 3) continue; probados.push(nuevo);
        const r2 = await seguro(nuevo); if (r2.ok) { r = r2; Cfg.ia.modelo = nuevo; guardarCfg(); break; } r = r2;
      }
    }
    if (!r.ok) { let d = ''; try { d = ((await r.json()).error || {}).message || ''; } catch (_) {} throw new Error('IA en línea: error ' + r.status + (d ? ' (' + d.slice(0, 90) + ')' : '')); }
    const j = await r.json();
    const t = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts;
    return (t || []).map(x => x.text || '').join('').trim();
  },
  hayLocal() { return !!this.llm; },
  hayOnline() { return !!Cfg.ia.key; },
  activa() {
    const m = Cfg.ia.modo;
    if (m === 'reglas') return false;
    if (m === 'local') return this.hayLocal();
    if (m === 'online') return this.hayOnline();
    return this.hayLocal() || this.hayOnline();
  },
  puedeVer() { return Cfg.ia.modo !== 'reglas' && Cfg.ia.modo !== 'local' && this.hayOnline(); },
  async generar(prompt, imagenes) {
    const m = Cfg.ia.modo;
    if (imagenes && imagenes.length) return this._online(prompt, imagenes);
    if (m === 'local') return this._local(prompt);
    if (m === 'online') return this._online(prompt);
    if (m === 'local+online') { try { if (this.hayLocal()) return await this._local(prompt); } catch (_) {} return this._online(prompt); }
    throw new Error('IA apagada');
  },
  json(t) { const m = String(t).match(/\{[\s\S]*\}|\[[\s\S]*\]/); if (!m) return null; return safeJSON(m[0], null); },

  /* El LLM solo reescribe el pedido con una frase-modelo; después lo ejecutan las mismas reglas (y el mismo "¿Confirmo?"). */
  async reescribir(texto, ejemplos) {
    const p = `Sos el intérprete de un asistente de negocio. Reescribí el pedido del usuario como UNA sola de estas frases-modelo (misma estructura, mismos nombres propios, fechas como "hoy", "mañana", "viernes" o dd/mm, horas como 15:30). Si el pedido no se parece a ninguna, respondé exactamente NINGUNA. No inventes datos. Respondé solo la frase.\n\nFrases-modelo:\n${ejemplos.map(e => '- ' + e).join('\n')}\n\nPedido: ${texto}\nFrase:`;
    const r = (await this.generar(p)).split('\n')[0].replace(/^[-*\s"]+|["\s]+$/g, '');
    if (!r || /^ninguna/i.test(r)) return null;
    return r;
  },
  async responderConDatos(pregunta, datos) {
    const p = `Respondé la pregunta usando SOLO los datos de abajo. Si la respuesta no está en los datos, respondé exactamente: "No tengo ese dato." Respuesta corta y directa, en ${Cfg.idioma === 'en' ? 'inglés' : 'español argentino'}. No inventes nada.\n\nDatos:\n${datos}\n\nPregunta: ${pregunta}\nRespuesta:`;
    return (await this.generar(p)).trim();
  },
  async leerFactura(dataUrl) {

/* ============ NÚCLEO DEL MOTOR: interpreta pedidos (es/en), confirma antes de guardar, deshace, recuerda ============ */
const R = (text, x) => ({ text, ...(x || {}) });
const ctx = { pending: null, choice: null, lastChoice: null, last: null, undo: [], redo: [], lastBot: '', lastReportData: null };

const rel = (f) => f === todayIso() ? L('hoy', 'today') : f === addDays(1) ? L('mañana', 'tomorrow') : f === addDays(-1) ? L('ayer', 'yesterday') : fmtFecha(f, Cfg.idioma);

/* ---------- búsqueda de personas y productos dentro de una frase ---------- */
function hitTokens(q, name) {

function personasEn(q) {
  const out = [];
  for (const p of Store.all('personas')) {
    let h = hitTokens(q, p.nombre), s = h.score, ok = h.strong >= 1, term = h.usados.join(' ');
    for (const a of (p.alias || [])) { const na = norm(a); if (na && (' ' + q + ' ').includes(' ' + na + ' ')) { s = Math.max(s, 1); ok = true; term = na; } }
    if (ok) out.push({ p, s, term });
  }
  out.sort((a, b) => b.s - a.s);
  const mx = out.length ? out[0].s : 0;
  const top = out.filter(x => x.s >= mx - 0.001);
  top.forEach(x => x.p._term = x.term);
  return top.map(x => x.p);
}

  const out = [];
  for (const it of Store.all('stock')) { const h = hitTokens(q, it.nombre); if (h.strong >= 1 && h.score >= (min || 0.5)) out.push({ it, s: h.score }); }

const quitarPersona = (q, p) => { const n = sigToks(p.nombre); return toks(q).filter(t => !n.some(x => tokEq(t, x) >= 0.8)).join(' '); };


/* Si el pedido trae un nombre completo (2+ palabras con mayúscula) que no coincide del todo con ninguna ficha, lo trata como persona nueva (no adivina). */
function nombreNuevoExplicito(raw) {
  const m = String(raw).replace(/^\s*\S+\s+/, '').match(/[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)+/);

  const conocida = Store.all('personas').some(p => { const nt = sigToks(p.nombre); return st.every(t => nt.some(x => tokEq(t, x) >= 0.8)); });

}


/* Devuelve el detalle con las mayúsculas y tildes originales (a partir del texto normalizado que sobró) */
function detalleLimpio(restNorm, raw, persona) {

  if (persona) { const pn = sigToks(persona.nombre || persona); toksR = toksR.filter(t => !pn.some(x => tokEq(t, x) >= 0.8)); }
  while (toksR.length && /^(para|a|de|con|for|to|with|el|la|al|on|at|in|the|an)$/.test(toksR[0])) toksR.shift();

/* ---------- confirmar antes de guardar / deshacer ---------- */

  const f = parseFecha(sin); const fecha = f ? f.iso : todayIso(); if (f) sin = f.rest;
  const h = parseHora(sin); const hora = h ? h.hm : nowHM(); if (h) sin = h.rest;
  const quienOrig = (() => { // recupera mayúsculas del texto original para el nombre de "con quién"
    if (!conQuien) return ''; const m = raw.match(/\b(?:con|acompañad[oa]\s+(?:de|por)|with|accompanied by)\s+(.+)$/i); return m ? m[1].replace(/\s+(hoy|ayer|mañana|a las.*)$/i, '').trim() : conQuien;
  })();
  const cp = personasEn(norm(quienOrig)); const con = cp.length === 1 ? cp[0].nombre : quienOrig;
  const hacer = (p, nombreLibre) => {
    const nombre = p ? p.nombre : nombreLibre;
    const prev = Store.all('accesos').filter(a => claveAcc(a) === (p ? p.id : norm(nombre))).sort(ordenAcc)[0];
    let aviso = '';
    if (tipo === 'ingreso' && prev && prev.tipo === 'ingreso') aviso = L('\n⚠️ Ya figura adentro desde ' + rel(prev.fecha) + ' ' + prev.hora + '.', '\n⚠️ Already inside since ' + rel(prev.fecha) + ' ' + prev.hora + '.');
    if (tipo === 'egreso' && (!prev || prev.tipo === 'egreso')) aviso = L('\n⚠️ No tiene un ingreso registrado.', '\n⚠️ No entry recorded for this person.');
    const texto = L(`Registro ${tipo.toUpperCase()} de ${nombre} ${rel(fecha)} a las ${hora}${con ? ' (con ' + con + ')' : ''}${p ? '' : ' como visita'}.`, `Record ${tipo === 'ingreso' ? 'CHECK-IN' : 'CHECK-OUT'} of ${nombre} ${rel(fecha)} at ${hora}${con ? ' (with ' + con + ')' : ''}${p ? '' : ' as a visitor'}.`) + aviso;
    return proponer(texto, [{ op: 'add', col: 'accesos', doc: { fecha, hora, tipo, personaId: p ? p.id : null, personaNombre: nombre, categoria: p ? lab('persona') : L('visita', 'visitor'), conQuien: con, por: nombreUsuario() } }], { desc: `${tipo} ${nombre} ${fecha} ${hora}` });
  };
  const nuevoN = nombreNuevoExplicito(String(raw).replace(/\s+(?:con|acompañad[oa]\s+(?:de|por)|with)\s+.+$/i, ''));
  if (nuevoN) return hacer(null, nuevoN);
  const r = conPersona(sin, p => hacer(p));
  if (r) return r;
  let libre = String(raw || '').replace(/^\s*(?:registra\w*|anota\w*|marca\w*)\s+/i, '').replace(/^\s*(?:ingres\w*|egres\w*|entrada|salida|check[ -]?(?:in|out))\s+(?:de\s+|del\s+|a\s+|for\s+)?/i, '').replace(/\s+(?:con|acompañad[oa]\s+(?:de|por)|with|accompanied by)\s+.+$/i, '').replace(/\s+(?:ingres\w*|egres\w*|entr[oó]|sali[oó]|lleg\w*|se fue|checked (?:in|out)|arrived|left)\b.*$/i, '').replace(/\b(hoy|ayer|mañana|today|yesterday|tomorrow)\b/ig, ' ').replace(/\b(?:a las?|at)\s+\d{1,2}(?:[:.h]\d{2})?\s*(?:am|pm|hs?)?/ig, ' ').replace(/\s+/g, ' ').trim();
  libre = cap(libre);
  if (!libre) return R(L('¿Quién? Decime el nombre.', 'Who? Tell me the name.'));
  return hacer(null, libre);
}

/* ---------- HISTORIAL (servicios, reparaciones, pagos) ---------- */
const lineaSvc = s => `${fmtFechaCorta(s.fecha)} · ${s.detalle}${s.objeto && !norm(s.detalle).includes(norm(s.objeto)) ? ' (' + s.objeto + ')' : ''}${s.importe ? ' · ' + money(s.importe) : ''}${s.pagado === false ? L(' · PENDIENTE DE PAGO', ' · UNPAID') : ''}`;
const svcDe = p => Store.all('servicios').filter(s => s.personaId === p.id || norm(s.personaNombre) === norm(p.nombre)).sort((a, b) => b.fecha.localeCompare(a.fecha));
function hHistorial(q, raw) {
  if (/\b(quien(es)?|who)\b.*\b(debe|deben|deuda|adeuda|owes?)\b|\b(pagos? pendientes?|deudores|unpaid|pending payments?|saldo pendiente)\b/.test(q)) {
    const imp = Store.all('servicios').filter(s => s.importe && s.pagado === false);
    if (!imp.length) return R(L('No hay pagos pendientes. 👌', 'No pending payments. 👌'));
    const total = imp.reduce((t, s) => t + (+s.importe || 0), 0);
    return R(L(`Pagos pendientes (${money(total)} en total):\n`, `Pending payments (${money(total)} total):\n`) + imp.map(s => '• ' + s.personaNombre + ' — ' + lineaSvc(s).replace(/ · PENDIENTE DE PAGO| · UNPAID/, '')).join('\n'), { reporte: true });
  }
  const palabra = /\b(reparacion|reparaciones|arreglo|arreglos|servicio|servicios|service|services|trabajo|trabajos|corte|cortes|venta|ventas|compra|compras|pago|pagos|cuota|cuotas|repair|repairs|job|jobs|haircut|sale|sales|payment|payments)\b/;
  if (palabra.test(q) && /\b(ultim[oa]s?|last|hicimos|hizo|hiciste|hice|hizo|did we|done|historial|history|cuantos|cuantas|how many|que|cuales|what|which|cuando|when|le (?:vendimos|cobramos)|debe|owes?)\b/.test(q)) {
    const r = conPersona(q, (p) => {
      const l = svcDe(p);
      if (!l.length) return R(L(`No tengo ${lab('servicios')} registrados de ${p.nombre}.`, `I have no ${lab('servicios')} recorded for ${p.nombre}.`));
      const cant = /\b(cuantos|cuantas|how many)\b/.test(q);
      const ult = /\b(ultim[oa]|last)\b/.test(q) || /\bcuando\b|\bwhen\b/.test(q);
      const obj = p.nota ? ` (${p.nota})` : '';
      const base = quitarPersona(q, p); ctx.last = { kinds: ['persona'], fn: (a) => hHistorial(base + ' ' + norm(a.persona || '')) };
      if (cant) return R(L(`${p.nombre} tiene ${l.length} ${plural(l.length, 'registro', 'registros')} de ${lab('servicios')}. Total: ${money(l.reduce((t, s) => t + (+s.importe || 0), 0))}.`, `${p.nombre} has ${l.length} ${lab('servicios')} on record. Total: ${money(l.reduce((t, s) => t + (+s.importe || 0), 0))}.`));
      if (ult) { const s = l[0]; return R(L(`Lo último para ${p.nombre}${obj}: ${lineaSvc(s)}.`, `Latest for ${p.nombre}${obj}: ${lineaSvc(s)}.`), { speak: L(`El último fue el ${fmtFechaCorta(s.fecha)}: ${s.detalle}.`, `The last one was on ${fmtFechaCorta(s.fecha)}: ${s.detalle}.`) }); }
      return R(L(`${ucf(lab('servicios'))} de ${p.nombre}${obj}:\n`, `${ucf(lab('servicios'))} for ${p.nombre}${obj}:\n`) + l.slice(0, 8).map(s => '• ' + lineaSvc(s)).join('\n') + (l.length > 8 ? L(`\n… y ${l.length - 8} más.`, `\n… and ${l.length - 8} more.`) : ''), { speak: L(`${p.nombre} tiene ${l.length} registros. El último: ${l[0].detalle}, el ${fmtFechaCorta(l[0].fecha)}.`, `${p.nombre} has ${l.length} records. The latest: ${l[0].detalle} on ${fmtFechaCorta(l[0].fecha)}.`) });
    });
    if (r) return r;
    const mn = String(raw || '').match(/\b(?:de|del|a|of|for|on)\s+([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)*)\s*[?.!]*$/);
    if (mn && !KWMOD.agenda.test(q)) return noEncontre(mn[1]);
    if (/\b(hicimos|hizo|did we|ultim[oa]|last)\b/.test(q) && !KWMOD.agenda.test(q)) return R(L('¿De quién? Decime el nombre del cliente.', 'Whose? Tell me the name.'));
    return null;
  }
  return null;
}

/* ---------- AGENDA ---------- */
const ESTADOS = ['pendiente', 'confirmado', 'en curso', 'listo', 'entregado', 'realizado', 'cancelado'];
const lineaAg = a => `${a.hora || '--:--'} · ${a.personaNombre}${a.titulo ? ' — ' + a.titulo : ''} (${L(a.estado || 'pendiente', { pendiente: 'pending', confirmado: 'confirmed', 'en curso': 'in progress', listo: 'ready', entregado: 'delivered', realizado: 'done', cancelado: 'cancelled' }[a.estado || 'pendiente'])})`;
const agendaDe = (d1, d2) => Store.all('agenda').filter(a => a.fecha >= d1 && a.fecha <= d2 && a.estado !== 'cancelado').sort((x, y) => (x.fecha + (x.hora || '')).localeCompare(y.fecha + (y.hora || '')));
function listarAgenda(f) {
  let rg = rangoFechas(f) || [todayIso(), todayIso()];
  if (f && f.rango === 'semana' && f.iso === todayIso()) rg = [todayIso(), addDays(6)];
  const lista = agendaDe(rg[0], rg[1]);
  const et = lab('agenda');
  if (rg[0] === rg[1]) {
    if (!lista.length) return R(L(`No tenés ${et} ${rel(rg[0])}.`, `You have no ${et} ${rel(rg[0])}.`), { speak: L(`No tenés ${et} ${rel(rg[0])}.`, `No ${et} ${rel(rg[0])}.`) });
    const t = L(`${cap(rel(rg[0]))} tenés ${lista.length} ${plural(lista.length, lab('agendaItem'), et)}:\n`, `${cap(rel(rg[0]))} you have ${lista.length} ${plural(lista.length, lab('agendaItem'), et)}:\n`) + lista.map(a => '• ' + lineaAg(a)).join('\n');
    return R(t, { speak: L(`${cap(rel(rg[0]))} tenés ${lista.length}. `, `${cap(rel(rg[0]))}: ${lista.length}. `) + lista.slice(0, 5).map(a => `${a.hora ? L('a las ', 'at ') + a.hora + ', ' : ''}${a.personaNombre}${a.titulo ? ', ' + a.titulo : ''}`).join('. '), reporte: true });
  }
  if (!lista.length) return R(L(`No hay ${et} entre el ${fmtFechaCorta(rg[0])} y el ${fmtFechaCorta(rg[1])}.`, `No ${et} between ${fmtFechaCorta(rg[0])} and ${fmtFechaCorta(rg[1])}.`));
  let t = L(`${cap(et)} del ${fmtFechaCorta(rg[0])} al ${fmtFechaCorta(rg[1])} (${lista.length}):\n`, `${cap(et)} from ${fmtFechaCorta(rg[0])} to ${fmtFechaCorta(rg[1])} (${lista.length}):\n`);
  let dia = ''; lista.forEach(a => { if (a.fecha !== dia) { dia = a.fecha; t += `\n${fmtFecha(dia, Cfg.idioma)}\n`; } t += '• ' + lineaAg(a) + '\n'; });
  return R(t.trim(), { speak: L(`Tenés ${lista.length} ${et} en ese período.`, `You have ${lista.length} ${et} in that period.`), reporte: true });
}
function conflicto(fecha, hora, exceptoId) { return hora ? Store.all('agenda').filter(a => a.fecha === fecha && a.hora === hora && a.estado !== 'cancelado' && a.id !== exceptoId) : []; }
function proximosDe(p) { return Store.all('agenda').filter(a => (a.personaId === p.id || norm(a.personaNombre) === norm(p.nombre)) && a.fecha >= todayIso() && !['cancelado', 'entregado', 'realizado'].includes(a.estado)).sort((x, y) => (x.fecha + (x.hora || '')).localeCompare(y.fecha + (y.hora || ''))); }

function hAgenda(q, raw) {
  const KW = /\b(turnos?|trabajos?|reservas?|citas?|agenda|entregas?|appointments?|jobs?|bookings?|schedule|deliver(?:y|ies))\b/;
  const f = parseFecha(q);
  // sin confirmar
  if (/\b(sin confirmar|no confirmad[oa]s?|pendientes? de confirmar|unconfirmed)\b/.test(q)) {
    const l = Store.all('agenda').filter(a => a.estado === 'pendiente' && a.fecha >= todayIso()).sort((x, y) => (x.fecha + (x.hora || '')).localeCompare(y.fecha + (y.hora || '')));
    if (!l.length) return R(L('No hay nada sin confirmar. 👌', 'Nothing unconfirmed. 👌'));
    return R(L('Sin confirmar:\n', 'Unconfirmed:\n') + l.map(a => `• ${rel(a.fecha)} ${lineaAg(a)}`).join('\n'));
  }
  // libre?
  if (/\b(esta libre|hay lugar|hay hueco|disponible|disponibilidad|libre|free|available|open slot)\b/.test(q) && (f || parseHora(q))) {
    const fecha = f ? f.iso : todayIso(); const h = parseHora(f ? f.rest : q);
    if (h) { const c = conflicto(fecha, h.hm); return R(c.length ? L(`No: ${rel(fecha)} a las ${h.hm} ya está ${c[0].personaNombre} (${c[0].titulo || ''}).`, `No: ${rel(fecha)} at ${h.hm} ${c[0].personaNombre} is already booked.`) : L(`Sí, ${rel(fecha)} a las ${h.hm} está libre.`, `Yes, ${rel(fecha)} at ${h.hm} is free.`)); }
    const l = agendaDe(fecha, fecha); return R(l.length ? L(`${cap(rel(fecha))} ya hay ocupado: ${l.map(a => a.hora).filter(Boolean).join(', ')}.`, `${cap(rel(fecha))} taken: ${l.map(a => a.hora).filter(Boolean).join(', ')}.`) : L(`${cap(rel(fecha))} está todo libre.`, `${cap(rel(fecha))} is completely free.`));
  }
  // cambiar estado
  const mEst = q.match(/\b(confirma\w*|marca\w*|pone\w*|pasa\w*|dej\w*|mark|set|confirm)\b.*?\b(confirmad[oa]|listo|lista|entregad[oa]|terminad[oa]|realizad[oa]|en curso|ready|done|delivered|confirmed|finished)\b|^(confirma\w*|confirm)\b/);
  if (mEst && KW.test(q) && !/\b(pasa\w*|mueve|mover|move|reprogram\w*)\b.*\b(al|a el|para|to)\b.*(lunes|martes|miercoles|jueves|viernes|sabado|domingo|manana|monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|\d)/.test(q)) {
    const w = mEst[2] || 'confirmado';
    const est = /confirm/.test(mEst[0]) && !mEst[2] ? 'confirmado' : /confirm/.test(w) ? 'confirmado' : /listo|lista|ready|terminad|finished|done/.test(w) ? (lab('agendaItem') === 'turno' || lab('agendaItem') === 'reserva' ? 'realizado' : 'listo') : /entreg|deliver/.test(w) ? 'entregado' : /curso/.test(w) ? 'en curso' : 'realizado';
    const r = conPersona(q, p => {
      const prox = proximosDe(p);
      if (!prox.length) return R(L(`${p.nombre} no tiene ${lab('agenda')} pendientes.`, `${p.nombre} has no open ${lab('agenda')}.`));
      const hacer = (a) => proponer(L(`Marco el ${lab('agendaItem')} de ${a.personaNombre} (${rel(a.fecha)} ${a.hora || ''}) como “${est}”.`, `Mark ${a.personaNombre}'s ${lab('agendaItem')} (${rel(a.fecha)} ${a.hora || ''}) as “${est}”.`), [{ op: 'upd', col: 'agenda', id: a.id, patch: { estado: est } }], { desc: `${a.personaNombre}: ${est}` });
      return prox.length === 1 ? hacer(prox[0]) : elegir(prox, a => `${rel(a.fecha)} ${a.hora || ''} ${a.titulo || ''}`, hacer);
    });
    if (r) return r;
  }
  // cancelar
  if (/\b(cancela\w*|anula\w*|borra\w*|elimina\w*|saca\w*|cancel|delete|remove)\b/.test(q) && KW.test(q)) {
    if (!Auth.esDueno()) return R(L('Solo el dueño puede cancelar. Pedíselo a él.', 'Only the owner can cancel. Ask them.'));
    const r = conPersona(q, p => {
      const prox = proximosDe(p);
      if (!prox.length) return R(L(`${p.nombre} no tiene ${lab('agenda')} próximos.`, `${p.nombre} has no upcoming ${lab('agenda')}.`));
      const hacer = (a) => proponer(L(`Cancelo el ${lab('agendaItem')} de ${a.personaNombre} (${rel(a.fecha)} ${a.hora || ''}${a.titulo ? ', ' + a.titulo : ''}).`, `Cancel ${a.personaNombre}'s ${lab('agendaItem')} (${rel(a.fecha)} ${a.hora || ''}).`), [{ op: 'upd', col: 'agenda', id: a.id, patch: { estado: 'cancelado' } }], { desc: L('Cancelado: ', 'Cancelled: ') + a.personaNombre });
      return prox.length === 1 ? hacer(prox[0]) : elegir(prox, a => `${rel(a.fecha)} ${a.hora || ''} ${a.titulo || ''}`, hacer);
    });
    if (r) return r;
  }
  // mover
  if (/\b(pasa\w*|mueve|mover|move|reprograma\w*|reschedule|cambia\w*|change|postergá|posterga\w*|adelanta\w*)\b/.test(q) && (KW.test(q) || true) && (f || parseHora(q)) && personasEn(q).length && !/precio|price/.test(q)) {
    const r = conPersona(q, p => {
      const prox = proximosDe(p);
      if (!prox.length) return R(L(`${p.nombre} no tiene ${lab('agenda')} próximos para mover.`, `${p.nombre} has no upcoming ${lab('agenda')} to move.`));
      let rest = quitarPersona(f ? f.rest : q, p); const h = parseHora(rest);
      const hacer = (a) => {
        const nf = f ? f.iso : a.fecha, nh = h ? h.hm : a.hora;
        const c = conflicto(nf, nh, a.id);
        return proponer(L(`Paso el ${lab('agendaItem')} de ${a.personaNombre} del ${rel(a.fecha)} ${a.hora || ''} al ${rel(nf)} ${nh || ''}.`, `Move ${a.personaNombre}'s ${lab('agendaItem')} from ${rel(a.fecha)} ${a.hora || ''} to ${rel(nf)} ${nh || ''}.`) + (c.length ? L(`\n⚠️ A esa hora ya está ${c[0].personaNombre}.`, `\n⚠️ ${c[0].personaNombre} is already at that time.`) : ''), [{ op: 'upd', col: 'agenda', id: a.id, patch: { fecha: nf, hora: nh } }], { desc: L('Movido: ', 'Moved: ') + a.personaNombre });
      };
      return prox.length === 1 ? hacer(prox[0]) : elegir(prox, a => `${rel(a.fecha)} ${a.hora || ''} ${a.titulo || ''}`, hacer);
    });
    if (r) return r;
  }
  // agendar
  const mAdd = q.match(/^(?:por favor\s+)?(agenda\w*|anota\w*|reserva\w*|pone\w*|saca\w*|crea\w*|programa\w*|book|schedule|add|create|make)\b\s*(.*)$/);
  if (mAdd && !/\b(stock|inventario|inventory|cliente|socio|client|member|customer|producto|recordatorio|reminder)\b/.test(q) && (f || parseHora(q) || KW.test(q))) {
    let rest = mAdd[2].replace(/\b(un|una|el|la|a|an|the)?\s*(turno|trabajo|reserva|cita|entrega|appointment|job|booking|delivery)s?\b/, ' ').replace(/\s+/g, ' ').trim();
    const f2 = parseFecha(rest); const fecha = f2 ? f2.iso : todayIso(); if (f2) rest = f2.rest;
    const h = parseHora(rest); const hora = h ? h.hm : ''; if (h) rest = h.rest;
    const hacer = (p, libre, detalle) => {
      const nombre = p ? p.nombre : libre; const c = conflicto(fecha, hora);
      return proponer(L(`Agendo ${lab('agendaItem')}: ${nombre}, ${rel(fecha)}${hora ? ' a las ' + hora : ''}${detalle ? ' — ' + detalle : ''}.`, `Book ${lab('agendaItem')}: ${nombre}, ${rel(fecha)}${hora ? ' at ' + hora : ''}${detalle ? ' — ' + detalle : ''}.`) + (c.length ? L(`\n⚠️ A esa hora ya está ${c[0].personaNombre}.`, `\n⚠️ ${c[0].personaNombre} is already booked then.`) : '') + (!hora ? L('\n(Sin hora definida.)', '\n(No time set.)') : ''),
        [{ op: 'add', col: 'agenda', doc: { fecha, hora, personaId: p ? p.id : null, personaNombre: nombre, titulo: detalle, estado: 'pendiente', por: nombreUsuario() } }], { desc: `${L('Agendado', 'Booked')}: ${nombre} ${fecha} ${hora}` });
    };
    const nuevoN = nombreNuevoExplicito(raw);
    if (nuevoN) return hacer(null, nuevoN, detalleLimpio(norm(rest).replace(norm(nuevoN), ' '), raw));
    const c = personasEn(rest);
    if (c.length === 1) return hacer(c[0], null, detalleLimpio(rest, raw, c[0]));
    if (c.length > 1) return elegir(c, p => p.nombre + (p.nota ? ' · ' + p.nota : ''), p => hacer(p, null, detalleLimpio(rest, raw, p)), c[0]._term);
    const m2 = raw.match(/(?:para|a|for|to)\s+([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)?)/);
    if (m2) return hacer(null, m2[1], detalleLimpio(norm(rest).replace(norm(m2[1]), ' '), raw));
    return R(L('¿Para quién lo agendo? Decime el nombre (por ejemplo: “agendá a Juan Pérez el viernes a las 15”).', 'Who is it for? Tell me the name.'));
  }
  // consultar
  if (KW.test(q) && /\b(que|cuales|cuantos|cuantas|mostra\w*|ver|lista\w*|tengo|tenemos|hay|what|which|how many|show|list|have|any|agenda)\b/.test(q)) {
    const fq = f || { iso: todayIso() };
    ctx.last = { kinds: ['fecha'], fn: (a) => listarAgenda(a.fecha ? { iso: a.fecha.iso, rango: a.fecha.rango } : fq) };
    return listarAgenda(fq);
  }
  return null;
}

/* ---------- STOCK ---------- */
const lineaStock = s => `${s.nombre}: ${s.cantidad} ${L('en stock', 'in stock')}${s.precio ? ' · ' + money(s.precio) : ''}${s.minimo != null && +s.cantidad <= +s.minimo ? ' ⚠️' : ''}`;
function hStock(q, raw) {
  const q2 = numerosAPalabra(q);
  if (/\b(stock bajo|poco stock|faltantes?|que falta|reponer|low stock|running low|out of stock|sin stock|a reponer)\b/.test(q)) {
    const l = Store.all('stock').filter(s => s.minimo != null && +s.cantidad <= +s.minimo);
    if (!l.length) return R(L('No hay productos con stock bajo. 👌', 'No low-stock items. 👌'));
    return R(L(`Stock bajo (${l.length}):\n`, `Low stock (${l.length}):\n`) + l.map(s => `• ${s.nombre}: ${s.cantidad} (${L('mínimo', 'minimum')} ${s.minimo})`).join('\n'), { speak: L(`Hay ${l.length} productos con stock bajo: `, `${l.length} low-stock items: `) + l.slice(0, 5).map(s => s.nombre).join(', '), reporte: true });
  }
  // nuevo producto
  const mNew = q2.match(/^(?:agrega\w*|crea\w*|alta|da de alta|add|create|new)\s+(?:un\s+|una\s+|nuevo\s+|nueva\s+|a\s+)?(?:producto|articulo|repuesto|item|product|part)\s+(.+)$/);
  if (mNew) {
    let rest = mNew[1]; let precio = null, cant = 0;
    const mp = rest.match(/\b(?:precio|a|price|at)\s+\$?(\d[\d.,]*)/); if (mp) { precio = parseNum(mp[1]); rest = rest.replace(mp[0], ' '); }
    const mc = rest.match(/\b(?:cantidad|stock|qty|quantity)\s+(\d+)/); if (mc) { cant = +mc[1]; rest = rest.replace(mc[0], ' '); }

  }
  // cambiar precio
  const mPr = q2.match(/\b(?:cambia\w*|actualiza\w*|pone\w*|ponele|sube\w*|baja\w*|set|change|update|raise|lower)\b.*?\bprecio\b.*?\b(?:de la|de las|de los|del|de|of)?\s*(.+?)\s+(?:a|en|to|at)\s+\$?(\d[\d.,]*)\s*$/);

  if (mAdd && (/\b(stock|inventario|inventory|llegaron|llego|received|restock|repone\w*)\b/.test(q2)) ) {
    const n = +mAdd[1]; const nombreQ = mAdd[2];
    const c = productosEn(nombreQ, 0.3);
    const hacer = it => proponer(L(`Sumo ${n} a ${it.nombre}: ${it.cantidad} → ${(+it.cantidad || 0) + n}.`, `Add ${n} to ${it.nombre}: ${it.cantidad} → ${(+it.cantidad || 0) + n}.`), [{ op: 'upd', col: 'stock', id: it.id, patch: { cantidad: (+it.cantidad || 0) + n } }], { desc: `+${n} ${it.nombre}` });
    if (c.length === 1) return hacer(c[0]); if (c.length > 1) return elegir(c, i => i.nombre + ' (' + i.cantidad + ')', hacer);
    const nom = cap(nombreQ.replace(/\b(unidades?|units?)\b/g, '').trim());
    return proponer(L(`No tengo “${nom}” en el stock. ¿Lo creo como producto nuevo con ${n} ${plural(n, 'unidad', 'unidades')}?`, `“${nom}” isn't in stock. Create it as a new product with ${n} units?`), [{ op: 'add', col: 'stock', doc: { nombre: nom, cantidad: n, precio: 0, minimo: 0 } }], { desc: L('Producto nuevo: ', 'New product: ') + nom });

  if (mRem && /\b(stock|inventario|inventory|vendi\w*|usamos|sold|used|gaste\w*)\b/.test(q2)) {

    if (c.length === 1) return hacer(c[0]); if (c.length > 1) return elegir(c, i => i.nombre + ' (' + i.cantidad + ')', hacer);
    return noEncontre(mRem[2], L('el producto', 'the product'));
  }
  // consulta de cantidad
  if (/\b(cuanto|cuantos|cuantas|hay|queda|quedan|tengo|tenemos|stock|how many|do we have|in stock|have we)\b/.test(q)) {
    const c = productosEn(q);

    if (/\bstock|inventario|inventory\b/.test(q)) return R(L('No encuentro ese producto en el stock.', "I can't find that product in stock."));
  }
  return null;
}

/* ---------- REPORTES ---------- */
function resumenPeriodo(d1, d2, titulo) {

    const act = ag.filter(a => a.estado !== 'cancelado');

    filas.push([ucf(lab('agenda')), String(act.length)]);
    if (d1 === d2) act.sort((x, y) => (x.hora || '').localeCompare(y.hora || '')).forEach(a => lin.push('   · ' + lineaAg(a)));
  }

    lin.push(L(`💰 ${ucf(lab('servicios'))}: ${sv.length} · total ${money(tot)} · cobrado ${money(tot - pend)} · pendiente ${money(pend)}`, `💰 ${ucf(lab('servicios'))}: ${sv.length} · total ${money(tot)} · collected ${money(tot - pend)} · pending ${money(pend)}`));
    filas.push([ucf(lab('servicios')), `${sv.length} · ${money(tot)}`], [L('Cobrado', 'Collected'), money(tot - pend)], [L('Pendiente de cobro', 'Pending'), money(pend)]);
  }

    const ac = Store.all('accesos').filter(a => a.fecha >= d1 && a.fecha <= d2);
    if (ac.length) { const i = ac.filter(a => a.tipo === 'ingreso').length, e = ac.filter(a => a.tipo === 'egreso').length; lin.push(L(`🚪 Ingresos: ${i} · Egresos: ${e}${d1 === d2 && d1 === todayIso() ? ' · Adentro ahora: ' + quienQueda().length : ''}`, `🚪 Entries: ${i} · Exits: ${e}`)); filas.push([L('Ingresos', 'Entries'), String(i)], [L('Egresos', 'Exits'), String(e)]); }
  }

    const fa = Store.all('facturas').filter(f => f.fecha >= d1 && f.fecha <= d2);
    if (fa.length) { lin.push(L(`🧾 Facturas de compra: ${fa.length} · ${money(fa.reduce((t, f) => t + (+f.total || 0), 0))}`, `🧾 Purchase invoices: ${fa.length} · ${money(fa.reduce((t, f) => t + (+f.total || 0), 0))}`)); filas.push([L('Facturas de compra', 'Purchase invoices'), `${fa.length} · ${money(fa.reduce((t, f) => t + (+f.total || 0), 0))}`]); }
  }
  ctx.lastReportData = { titulo, d1, d2, filas, servicios: sv, agenda: ag };
  return lin;
}

/* ---------- RECORDATORIOS ---------- */
function hRecordatorios(q, raw) {
  if (/^(mis\s+)?(recordatorios|pendientes|reminders)\b|\b(que recordatorios|que tengo pendiente|my reminders|show reminders|list reminders)\b/.test(q)) {
    const l = Store.all('recordatorios').filter(r => !r.hecho).sort((a, b) => a.cuando.localeCompare(b.cuando));
    if (!l.length) return R(L('No tenés recordatorios pendientes.', 'No pending reminders.'));
    return R(L('Recordatorios:\n', 'Reminders:\n') + l.map((r, i) => `${i + 1}. ${rel(r.cuando.slice(0, 10))} ${r.cuando.slice(11)} — ${r.texto}`).join('\n'), { buttons: l.slice(0, 5).map((r, i) => ({ label: L(`✔ Hecho ${i + 1}`, `✔ Done ${i + 1}`), run: () => { aplicarTx([{ op: 'upd', col: 'recordatorios', id: r.id, patch: { hecho: true } }]); return R(L('Marcado como hecho.', 'Marked as done.'), { refrescar: true }); } })) });
  }
  const m = q.match(/^(?:por favor\s+)?(?:avisa\w*|recorda\w*|recuerda\w*|acuerda\w*|acordate|remind|set a reminder|reminder|recordatorio)\s*(?:me|te|nos)?\s*(?:(?:de|que|to|about)\b)?\s*(.*)$/);
  if (m) {
    let rest = m[1]; let cuando = null;
    const en = rest.match(/\ben\s+(\d+)\s*(minutos?|min|horas?|hs|hours?|minutes?)\b/);
    if (en) { const d = new Date(); const n = +en[1]; if (/^(min)/.test(en[2])) d.setMinutes(d.getMinutes() + n); else d.setHours(d.getHours() + n); cuando = iso(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); rest = rest.replace(en[0], ' '); }
    let nota = '';
    if (!cuando) {
      const f = parseFecha(rest); if (f) rest = f.rest;
      const h = parseHora(rest); if (h) rest = h.rest;
      let fecha = f ? f.iso : null, hora = h ? h.hm : null;
      if (!fecha) fecha = hora && hora > nowHM() ? todayIso() : (hora ? addDays(1) : addDays(1));
      if (!hora) { hora = '09:00'; nota = L(' (a las 09:00, porque no dijiste hora)', ' (at 09:00, since no time was given)'); }
      cuando = fecha + 'T' + hora;
    }
    let texto = detalleLimpio(rest.replace(/^(que|about)\s+/, ''), raw);
    if (!texto) return R(L('¿Qué querés que te recuerde?', 'What should I remind you about?'));
    return proponer(L(`Te aviso ${rel(cuando.slice(0, 10))} a las ${cuando.slice(11)}${nota}: ${texto}.`, `I'll remind you ${rel(cuando.slice(0, 10))} at ${cuando.slice(11)}${nota}: ${texto}.`), [{ op: 'add', col: 'recordatorios', doc: { cuando, texto, hecho: false, avisado: false } }], { desc: L('Recordatorio: ', 'Reminder: ') + texto });
  }
  return null;
}

      else { total += cant * precio; lin.push(`${cant} × ${nombreShow} — ${money(cant * precio)}`); }
    }
    const nombreCli = persona ? persona.nombre : cap(mP[2]);
    const t = L(`Presupuesto para ${nombreCli}\n`, `Quote for ${nombreCli}\n`) + lin.join('\n') + L(`\nTotal: ${money(total)}`, `\nTotal: ${money(total)}`) + (sinPrecio.length ? L(`\n⚠️ Falta el precio de: ${sinPrecio.join(', ')}. Decime el precio (ej: “${sinPrecio[0]} a 5000”).`, `\n⚠️ Missing price for: ${sinPrecio.join(', ')}.`) : '');

    const best = pl.map(p => ({ p, s: hitTokens(q, p.nombre).score })).sort((a, b) => b.s - a.s)[0];
    if (best && best.s >= 0.6) {

function hWhatsapp(q, raw) {
